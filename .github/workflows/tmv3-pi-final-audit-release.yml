name: V3 PI final audit-order guarded release
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-pi-final-audit-release.yml
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node code checks and PI regression
        run: |
          node --check tools/tmv3-pi-final-audit-release.cjs
          node tools/test-tmv3-preinspection-owner.cjs
          node tools/test-tmv3-pi-calendar-review.cjs
      - name: Guard live 689-function Apps Script source
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-final-audit-release.cjs dry-run
      - name: Deploy PI audit-order fix with exact readback
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-final-audit-release.cjs deploy
