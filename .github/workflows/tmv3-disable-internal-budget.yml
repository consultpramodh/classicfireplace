name: Remove V3 internal API budget
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-disable-internal-budget.yml]
permissions:
  contents: write
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task_mapping
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull live source, test, patch same project, verify deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-disable-internal-budget.cjs
      - name: Sync verified live changes to canonical branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/tmv3-clean/00_Config.js apps-script/tmv3-clean/20_Striven.js apps-script/tmv3-clean/60_Automation.js
          git commit -m "Deploy V3.12.15 with internal API budget disabled"
          git push origin HEAD:task_mapping
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-budget-source-backup-${{ github.run_id }}
          path: internal-budget-release-evidence/
