name: Task Mapping Standardization R1.5.6 PreInspection Calendar Reorganization

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/task-mapping-standardization-r1-5-6-trigger.txt

permissions:
  contents: read

concurrency:
  group: task-mapping-standardization-r1-5
  cancel-in-progress: false

jobs:
  guarded-deploy:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Deploy guarded Standardization R1.5.6
        shell: bash
        run: node tools/deploy-task-mapping-standardization-r1-5.js

      - name: Apply native PreInspection rich links and restore API deployment
        shell: bash
        run: |
          set -euo pipefail
          OUT="task-mapping-standardization-r1-5-6-output"
          mkdir -p "$OUT"
          printf '%s\n' '{"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}' > .clasp.json

          TARGET='AKfycbxCNxV4vsi002BCpoihsbjOLdJxs-vgoo_qbUCQ0mtd_QNw11cDxLtK2ThNlk2AiBuy'
          PREVIOUS_VERSION='20'
          PREVIOUS_DESCRIPTION='Website operations v3 - unified task links for Service, Inspection, Delivery, and Install'
          UPDATED=0

          restore() {
            code=$?
            if [ "$UPDATED" -eq 1 ]; then
              npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$PREVIOUS_VERSION" -d "$PREVIOUS_DESCRIPTION" | tee "$OUT/api-deployment-restore.log" || exit 2
            fi
            exit "$code"
          }
          trap restore EXIT

          npx -y @google/clasp@3.3.0 deployments --json | tee "$OUT/api-deployments-before.json"
          node - "$OUT/api-deployments-before.json" "$TARGET" <<'NODE'
          const fs=require('fs');
          const [file,target]=process.argv.slice(2);
          const raw=fs.readFileSync(file,'utf8');
          const arr=JSON.parse(raw.slice(raw.indexOf('[')));
          const d=arr.find(x=>x.deploymentId===target);
          if(!d) throw new Error('Target API deployment not found.');
          if(Number(d.versionNumber)!==20) throw new Error('Expected API deployment v20, found '+JSON.stringify(d));
          NODE

          npx -y @google/clasp@3.3.0 version 'PreInspection R1.5.6 rich links runtime'
          npx -y @google/clasp@3.3.0 versions --json | tee "$OUT/api-versions.json"
          NEW_VERSION=$(node - "$OUT/api-versions.json" <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync(process.argv[2],'utf8');
          const arr=JSON.parse(raw.slice(raw.indexOf('[')));
          process.stdout.write(String(Math.max(...arr.map(x=>Number(x.versionNumber)||0))));
          NODE
          )
          echo "temporaryVersion=$NEW_VERSION" | tee "$OUT/api-temporary-version.txt"

          npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$NEW_VERSION" -d 'PreInspection R1.5.6 rich links runtime'
          UPDATED=1

          set +e
          npx -y @google/clasp@3.3.0 run --nondev applyPreInspectRichLinksR1_5_6 2>&1 | tee "$OUT/rich-links-runtime.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          if grep -Eiq 'Exception:|storage NOT_FOUND|ScriptError|Execution failed|(^|[^A-Za-z])Error:' "$OUT/rich-links-runtime.log"; then
            exit 1
          fi
          grep -q 'RICH_LINKS_VERIFIED' "$OUT/rich-links-runtime.log"

          npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$PREVIOUS_VERSION" -d "$PREVIOUS_DESCRIPTION" | tee "$OUT/api-deployment-restore.log"
          UPDATED=0
          trap - EXIT
          echo "RICH_LINKS_APPLIED_AND_API_DEPLOYMENT_RESTORED" | tee "$OUT/runtime-result.txt"

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-standardization-r1-5-6-${{ github.run_id }}
          path: task-mapping-standardization-r1-5-6-output/
          if-no-files-found: warn
          retention-days: 30
