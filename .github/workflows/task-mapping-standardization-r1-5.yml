name: Task Mapping Standardization R1.5.6 PreInspection Calendar Reorganization

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/task-mapping-standardization-r1-5-6-trigger.txt

permissions:
  contents: read

concurrency:
  group: task-mapping-standardization-r1-5
  cancel-in-progress: false

jobs:
  guarded-deploy:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Deploy guarded Standardization R1.5.6
        shell: bash
        run: node tools/deploy-task-mapping-standardization-r1-5.js

      - name: Apply native PreInspection rich links through temporary web gateway
        shell: bash
        run: |
          set -euo pipefail
          OUT="task-mapping-standardization-r1-5-6-output"
          BASE=$(mktemp -d)
          TARGET='AKfycbxCNxV4vsi002BCpoihsbjOLdJxs-vgoo_qbUCQ0mtd_QNw11cDxLtK2ThNlk2AiBuy'
          PREVIOUS_VERSION='20'
          PREVIOUS_DESCRIPTION='Website operations v3 - unified task links for Service, Inspection, Delivery, and Install'
          WORK=$(mktemp -d)
          NONCE=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")
          SOURCE_TRANSIENT=0
          DEPLOYMENT_UPDATED=0

          (cd "$BASE" && npx -y @google/clasp@3.3.0 clone 1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m --rootDir src)
          test -f "$BASE/src/99_Task_Mapping_Standardization_R1.js"
          test -f "$BASE/src/98_Web_Operations_Gateway.js"
          grep -q 'TASK_MAPPING_STANDARDIZATION_R1_5_6_PREINSPECT_RICH_LINKS_20260922' "$BASE/src/99_Task_Mapping_Standardization_R1.js"
          cp -a "$BASE/." "$WORK/"

          node - "$WORK/src/98_Web_Operations_Gateway.js" "$NONCE" <<'NODE'
          const fs=require('fs');
          const [file,nonce]=process.argv.slice(2);
          let s=fs.readFileSync(file,'utf8');
          const old='function doGet() {';
          if(!s.includes(old)) throw new Error('doGet anchor missing.');
          const injected=
            'function doGet(e) {\n' +
            '  if (e && e.parameter && e.parameter.__r156 === ' + JSON.stringify(nonce) + ') {\n' +
            '    return tmWebJson_(applyPreInspectRichLinksR1_5_6());\n' +
            '  }';
          s=s.replace(old,injected);
          fs.writeFileSync(file,s);
          NODE

          restore_all() {
            code=$?
            if [ "$DEPLOYMENT_UPDATED" -eq 1 ]; then
              npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$PREVIOUS_VERSION" -d "$PREVIOUS_DESCRIPTION" > "$OUT/web-deployment-restore.log" 2>&1 || true
            fi
            if [ "$SOURCE_TRANSIENT" -eq 1 ]; then
              (cd "$BASE" && npx -y @google/clasp@3.3.0 push --force) > "$OUT/source-restore.log" 2>&1 || true
            fi
            exit "$code"
          }
          trap restore_all EXIT

          (cd "$WORK" && npx -y @google/clasp@3.3.0 push --force)
          SOURCE_TRANSIENT=1

          printf '%s\n' '{"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}' > .clasp.json
          npx -y @google/clasp@3.3.0 deployments --json | tee "$OUT/web-deployments-before.json"
          node - "$OUT/web-deployments-before.json" "$TARGET" <<'NODE'
          const fs=require('fs');
          const [file,target]=process.argv.slice(2);
          const raw=fs.readFileSync(file,'utf8');
          const arr=JSON.parse(raw.slice(raw.indexOf('[')));
          const d=arr.find(x=>x.deploymentId===target);
          if(!d) throw new Error('Website deployment not found.');
          if(Number(d.versionNumber)!==20) throw new Error('Expected website deployment v20, found '+JSON.stringify(d));
          NODE

          npx -y @google/clasp@3.3.0 version 'PreInspection R1.5.6 temporary web rich-link runtime'
          npx -y @google/clasp@3.3.0 versions --json | tee "$OUT/web-versions.json"
          NEW_VERSION=$(node - "$OUT/web-versions.json" <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync(process.argv[2],'utf8');
          const arr=JSON.parse(raw.slice(raw.indexOf('[')));
          process.stdout.write(String(Math.max(...arr.map(x=>Number(x.versionNumber)||0))));
          NODE
          )

          npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$NEW_VERSION" -d 'PreInspection R1.5.6 temporary web rich-link runtime'
          DEPLOYMENT_UPDATED=1

          node - "$HOME/.clasprc.json" "/tmp/r156-access-token" <<'NODE'
          const fs=require('fs');
          const [configFile,outFile]=process.argv.slice(2);
          const cfg=JSON.parse(fs.readFileSync(configFile,'utf8'));

          function walk(value, found) {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              value.forEach(v=>walk(v,found));
              return;
            }
            Object.entries(value).forEach(([k,v])=>{
              const key=k.replace(/[_-]/g,'').toLowerCase();
              if (typeof v === 'string' && v) {
                if (key === 'accesstoken' && !found.accessToken) found.accessToken=v;
                if (key === 'refreshtoken' && !found.refreshToken) found.refreshToken=v;
                if (key === 'clientid' && !found.clientId) found.clientId=v;
                if (key === 'clientsecret' && !found.clientSecret) found.clientSecret=v;
              }
              walk(v,found);
            });
          }

          (async()=>{
            const found={};
            walk(cfg,found);
            let accessToken=found.accessToken || '';

            if (found.refreshToken && found.clientId && found.clientSecret) {
              const body=new URLSearchParams({
                client_id:found.clientId,
                client_secret:found.clientSecret,
                refresh_token:found.refreshToken,
                grant_type:'refresh_token'
              });
              const response=await fetch('https://oauth2.googleapis.com/token',{
                method:'POST',
                headers:{'content-type':'application/x-www-form-urlencoded'},
                body
              });
              if(!response.ok) throw new Error('OAuth token refresh failed with HTTP '+response.status);
              const json=await response.json();
              accessToken=String(json.access_token || '');
            }

            if(!accessToken) throw new Error('No usable OAuth access token was available in clasp credentials.');
            fs.writeFileSync(outFile,accessToken,{mode:0o600});
            console.log('OAUTH_ACCESS_TOKEN_READY');
          })().catch(err=>{ console.error(err.message); process.exit(1); });
          NODE

          ACCESS_TOKEN="$(cat /tmp/r156-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"

          curl --location-trusted --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://script.google.com/macros/s/$TARGET/exec?__r156=$NONCE" \
            -o "$OUT/web-runtime-response.json"

          rm -f /tmp/r156-access-token
          unset ACCESS_TOKEN

          node - "$OUT/web-runtime-response.json" <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync(process.argv[2],'utf8').trim();
          let value;
          try { value=JSON.parse(raw); }
          catch(err) { throw new Error('Web runtime did not return JSON. First bytes: '+raw.slice(0,200)); }
          if(value.status!=='COMPLETE') throw new Error('Rich-link web runtime incomplete: '+JSON.stringify(value));
          if(!Array.isArray(value.events) || value.events.length!==6) throw new Error('Expected six rich-link results.');
          const bad=value.events.filter(x=>x.status!=='RICH_LINKS_VERIFIED');
          if(bad.length) throw new Error('Rich-link verification failures: '+JSON.stringify(bad));
          console.log(JSON.stringify({status:'WEB_RICH_LINKS_VERIFIED',eventCount:value.events.length}));
          NODE

          npx -y @google/clasp@3.3.0 deploy -i "$TARGET" -V "$PREVIOUS_VERSION" -d "$PREVIOUS_DESCRIPTION" | tee "$OUT/web-deployment-restore.log"
          DEPLOYMENT_UPDATED=0

          (cd "$BASE" && npx -y @google/clasp@3.3.0 push --force) | tee "$OUT/source-restore.log"
          SOURCE_TRANSIENT=0
          trap - EXIT

          echo "RICH_LINKS_APPLIED_VIA_WEB_GATEWAY_AND_ALL_TEMPORARY_CHANGES_RESTORED" | tee "$OUT/runtime-result.txt"

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-standardization-r1-5-6-${{ github.run_id }}
          path: task-mapping-standardization-r1-5-6-output/
          if-no-files-found: warn
          retention-days: 30
