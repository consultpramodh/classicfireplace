name: TEMP Upload Valor Images to Striven
# Finalize approved Valor image defaults

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-valor-striven-image-upload.yml'

permissions:
  contents: read

concurrency:
  group: temp-valor-striven-image-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Valor pilot branch
        uses: actions/checkout@v4
        with:
          ref: work/valor-image-pilot-10
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate runner
        run: node --check vendor-catalog/valor/pilot-10/striven-image-upload-runner.js

      - name: Upload guarded Valor images to Striven
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node vendor-catalog/valor/pilot-10/striven-image-upload-runner.js

      - name: Preserve upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valor-striven-image-upload-${{ github.run_id }}
          path: valor-striven-image-upload-output/
          if-no-files-found: warn
          retention-days: 30
