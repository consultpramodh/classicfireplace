name: Read pending PreInspection contracts
on:
  push:
    branches: [task_mapping]
    paths: ['.github/workflows/tmv3-preinspection-pending-review.yml']
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/tmv3-preinspection-pending-review.cjs
      - name: Read five pending live event plans without business writes
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-preinspection-pending-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preinspection-pending-review-${{ github.run_id }}
          path: preinspection-pending-review/
          retention-days: 30
