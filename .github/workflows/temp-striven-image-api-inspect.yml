name: TEMP Inspect Striven Item Image API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-striven-image-api-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Striven API help
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://api.striven.com/Help/Api/POST-v1-Items-id-Images"
            "https://api.striven.com/Help/Api/POST-v1-items-id-images"
            "https://api.striven.com/Help/Api/GET-v1-Items-id-Images"
            "https://api.striven.com/Help/Api/GET-v1-items-id-images"
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L -sS -D /tmp/headers.txt "$u" -o /tmp/body.html || true
            head -40 /tmp/headers.txt || true
            perl -0777 -pe 's/<script.*?<\/script>/ /gis; s/<style.*?<\/style>/ /gis; s/<[^>]+>/ /g; s/\s+/ /g' /tmp/body.html | head -c 18000 || true
            echo
          done
