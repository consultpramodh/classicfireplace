name: TEMP Inspect Striven Item Image API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-striven-image-api-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Swagger for item image APIs
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS "https://api.striven.com/swagger/v1/swagger.json" -o /tmp/swagger.json
          echo "=== MATCHING PATHS ==="
          jq -r '.paths | keys[]' /tmp/swagger.json | grep -Ei 'items.*(image|picture|attachment)|(image|picture|attachment).*items' || true
          echo "=== PATH DEFINITIONS ==="
          jq '.paths | with_entries(select(.key | test("items.*(image|picture|attachment)|(image|picture|attachment).*items"; "i")))' /tmp/swagger.json
          echo "=== RELATED DEFINITIONS ==="
          jq '.definitions | with_entries(select(.key | test("image|picture|attachment|file"; "i")))' /tmp/swagger.json
