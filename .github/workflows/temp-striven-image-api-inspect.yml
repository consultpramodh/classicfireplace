name: TEMP Inspect Striven Item Image API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-striven-image-api-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover Striven image API help links
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS "https://api.striven.com/Help" -o /tmp/help.html
          echo "=== IMAGE/ITEM API HREFS ==="
          grep -Eo 'href="[^"]+"' /tmp/help.html | sed 's/^href="//;s/"$//' | grep -Ei 'item|image|picture|attachment' | sort -u | head -300 || true
          echo "=== RAW CONTEXT AROUND IMAGES ==="
          grep -Ein -C 3 'image|picture|attachment|items' /tmp/help.html | head -500 || true
