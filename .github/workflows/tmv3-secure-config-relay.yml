name: Task Mapping V3 Secure Config Relay

on:
  push:
    branches:
      - task_mapping
    paths:
      - 'release-candidates/tmv3-secure-config-relay.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-mapping-v3-secure-config-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task_mapping
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate relay tool
        run: node --check tools/tmv3-secure-config-relay.js

      - name: Relay approved V3 configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-secure-config-relay.js

      - name: Preserve non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-secure-config-relay-${{ github.run_id }}
          path: autopatch-output-v3-config/
          if-no-files-found: warn
          retention-days: 30
