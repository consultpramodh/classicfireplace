name: Task Mapping V3 Secure Config Relay

on:
  push:
    branches:
      - task_mapping
    paths:
      - 'release-candidates/tmv3-secure-config-relay.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-mapping-v3-secure-config-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task_mapping
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Google authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          npx -y @google/clasp@3.3.0 show-authorized-user --json >/dev/null

      - name: Relay approved Script Properties without exposing values
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          PROD_SCRIPT_ID="1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m"
          V3_SCRIPT_ID="1shaSL1CeNhR2-fr8H4x0fP2KUIjpOizLFyrNRAnGGXkCvERX4hZyJ5Gt"

          TMP="$(mktemp -d)"
          OUT="$GITHUB_WORKSPACE/autopatch-output-v3-config"
          mkdir -p "$OUT"

          # Extract refresh/client credentials locally. Never print them.
          printf '%s' "$CLASPRC_JSON" > "$TMP/clasprc.json"

          node - "$TMP/clasprc.json" "$TMP/oauth.json" <<'NODE'
          const fs = require('fs');
          const [input, output] = process.argv.slice(2);
          const raw = JSON.parse(fs.readFileSync(input, 'utf8'));

          function walk(obj, wanted, seen=new Set()) {
            if (!obj || typeof obj !== 'object' || seen.has(obj)) return '';
            seen.add(obj);
            for (const [k,v] of Object.entries(obj)) {
              if (wanted.includes(k) && typeof v === 'string' && v) return v;
            }
            for (const v of Object.values(obj)) {
              const found = walk(v, wanted, seen);
              if (found) return found;
            }
            return '';
          }

          const token = raw.token || raw.tokens || raw.credentials || {};
          const settings = raw.oauth2ClientSettings || raw.oauth2Client || raw.client || {};

          const refreshToken =
            token.refresh_token || token.refreshToken ||
            walk(raw, ['refresh_token','refreshToken']);

          const clientId =
            settings.clientId || settings.client_id ||
            walk(raw, ['clientId','client_id']);

          const clientSecret =
            settings.clientSecret || settings.client_secret ||
            walk(raw, ['clientSecret','client_secret']);

          if (!refreshToken || !clientId || !clientSecret) {
            throw new Error('CLASPRC_JSON is missing refresh-token client credentials.');
          }

          fs.writeFileSync(output, JSON.stringify({refreshToken,clientId,clientSecret}));
          NODE

          ACCESS_TOKEN="$(
            node - "$TMP/oauth.json" <<'NODE'
            const fs = require('fs');
            const x = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const body = new URLSearchParams({
              client_id: x.clientId,
              client_secret: x.clientSecret,
              refresh_token: x.refreshToken,
              grant_type: 'refresh_token'
            });
            fetch('https://oauth2.googleapis.com/token', {
              method:'POST',
              headers:{'Content-Type':'application/x-www-form-urlencoded'},
              body
            }).then(async r => {
              const j = await r.json();
              if (!r.ok || !j.access_token) throw new Error('OAuth refresh failed');
              process.stdout.write(j.access_token);
            }).catch(e => { console.error(e.message); process.exit(1); });
          NODE
          )"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Could not obtain Google access token."
            exit 1
          fi

          api_get_content() {
            local script_id="$1"
            local output="$2"
            curl -fsSL               -H "Authorization: Bearer $ACCESS_TOKEN"               "https://script.googleapis.com/v1/projects/$script_id/content"               > "$output"
          }

          api_put_content() {
            local script_id="$1"
            local input="$2"
            curl -fsSL -X PUT               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               --data-binary "@$input"               "https://script.googleapis.com/v1/projects/$script_id/content"               >/dev/null
          }

          api_create_version() {
            local script_id="$1"
            local description="$2"
            local output="$3"
            node -e 'process.stdout.write(JSON.stringify({description:process.argv[1]}))' "$description" > "$TMP/version-body.json"
            curl -fsSL -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               --data-binary "@$TMP/version-body.json"               "https://script.googleapis.com/v1/projects/$script_id/versions"               > "$output"
          }

          api_create_deployment() {
            local script_id="$1"
            local version="$2"
            local description="$3"
            local output="$4"
            node -e 'process.stdout.write(JSON.stringify({versionNumber:Number(process.argv[1]),manifestFileName:"appsscript",description:process.argv[2]}))' "$version" "$description" > "$TMP/deploy-body.json"
            curl -fsSL -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               --data-binary "@$TMP/deploy-body.json"               "https://script.googleapis.com/v1/projects/$script_id/deployments"               > "$output"
          }

          api_delete_deployment() {
            local script_id="$1"
            local deployment_id="$2"
            if [ -n "$deployment_id" ]; then
              curl -fsSL -X DELETE                 -H "Authorization: Bearer $ACCESS_TOKEN"                 "https://script.googleapis.com/v1/projects/$script_id/deployments/$deployment_id"                 >/dev/null || true
            fi
          }

          canonical_hash() {
            node - "$1" <<'NODE'
            const fs=require('fs'), crypto=require('crypto');
            const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const files=(x.files||[]).map(f=>({name:f.name,type:f.type,source:f.source||''}))
              .sort((a,b)=>a.name.localeCompare(b.name));
            process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(files)).digest('hex'));
          NODE
          }

          build_content() {
            local pre="$1"
            local js_name="$2"
            local js_source="$3"
            local output="$4"
            local mode="$5"

            JS_NAME="$js_name" JS_SOURCE="$js_source" MODE="$mode"             node - "$pre" "$output" <<'NODE'
            const fs=require('fs');
            const [prePath,outPath]=process.argv.slice(2);
            const pre=JSON.parse(fs.readFileSync(prePath,'utf8'));
            const mode=process.env.MODE;
            const helper={
              name:process.env.JS_NAME,
              type:'SERVER_JS',
              source:process.env.JS_SOURCE
            };

            const files=(pre.files||[]).filter(f=>f.name!==helper.name && f.name!=='appsscript');

            const originalManifest=(pre.files||[]).find(f=>f.name==='appsscript');
            let manifest={timeZone:'America/Toronto',runtimeVersion:'V8',exceptionLogging:'STACKDRIVER'};
            if (originalManifest && originalManifest.source) {
              try { manifest=JSON.parse(originalManifest.source); } catch {}
            }

            manifest.webapp={
              access:'ANYONE_ANONYMOUS',
              executeAs:'USER_DEPLOYING'
            };

            // Keep production's existing authorized scopes. For the V3 receiver
            // use a minimal bootstrap source + no explicit broad scopes.
            if (mode==='V3_RECEIVER') {
              delete manifest.oauthScopes;
              manifest.timeZone='America/Toronto';
              manifest.runtimeVersion='V8';
            }

            const outputFiles = mode==='V3_RECEIVER'
              ? [
                  helper,
                  {name:'appsscript',type:'JSON',source:JSON.stringify(manifest,null,2)}
                ]
              : files.concat([
                  helper,
                  {name:'appsscript',type:'JSON',source:JSON.stringify(manifest,null,2)}
                ]);

            fs.writeFileSync(outPath,JSON.stringify({files:outputFiles}));
            NODE
          }

          PROD_DEPLOY=""
          V3_DEPLOY=""

          cleanup() {
            status=$?
            api_delete_deployment "$PROD_SCRIPT_ID" "$PROD_DEPLOY"
            api_delete_deployment "$V3_SCRIPT_ID" "$V3_DEPLOY"

            # Restore exact heads, regardless of failure stage.
            if [ -f "$TMP/prod-pre.json" ]; then api_put_content "$PROD_SCRIPT_ID" "$TMP/prod-pre.json" || true; fi
            if [ -f "$TMP/v3-pre.json" ]; then api_put_content "$V3_SCRIPT_ID" "$TMP/v3-pre.json" || true; fi
            exit "$status"
          }
          trap cleanup EXIT

          # ----------------------------------------------------------------
          # Fresh source checkpoints.
          # ----------------------------------------------------------------
          api_get_content "$PROD_SCRIPT_ID" "$TMP/prod-pre.json"
          api_get_content "$V3_SCRIPT_ID" "$TMP/v3-pre.json"

          PROD_PRE_HASH="$(canonical_hash "$TMP/prod-pre.json")"
          V3_PRE_HASH="$(canonical_hash "$TMP/v3-pre.json")"

          # Freshness check immediately before temporary source replacement.
          api_get_content "$PROD_SCRIPT_ID" "$TMP/prod-fresh.json"
          api_get_content "$V3_SCRIPT_ID" "$TMP/v3-fresh.json"

          test "$PROD_PRE_HASH" = "$(canonical_hash "$TMP/prod-fresh.json")"
          test "$V3_PRE_HASH" = "$(canonical_hash "$TMP/v3-fresh.json")"

          V3_TOKEN="$(openssl rand -hex 32)"
          PROD_TOKEN="$(openssl rand -hex 32)"

          V3_JS="$(cat <<JS
          var TMPV3_RECEIVER_TOKEN = '$V3_TOKEN';

          function doPost(e) {
            try {
              var body = JSON.parse(e && e.postData && e.postData.contents ? e.postData.contents : '{}');
              if (String(body.token || '') !== TMPV3_RECEIVER_TOKEN) {
                return TMPV3_response_({ok:false,status:'UNAUTHORIZED'});
              }

              if (body.action === 'health') {
                return TMPV3_response_({ok:true,status:'HEALTH_OK'});
              }

              if (body.action === 'import') {
                var allowed = [
                  'CLIENT_ID','CLIENT_SECRET','Striven_Customers_ReportAPI',
                  'Striven_CustomerLocations_ReportAPI','Striven_Contacts_ReportAPI',
                  'Striven_ApprovedSalesOrders_ReportAPI','Striven_DeliveryApprovedOrders_ReportAPI',
                  'Striven_InstallTasks_ReportAPI','Striven_DeliveryTasks_ReportAPI',
                  'Striven_ServiceTasks_ReportAPI','Striven_ServiceWorkOrders_ReportAPI'
                ];

                var config = body.config || {};
                var safe = {};
                allowed.forEach(function(key) {
                  var value = String(config[key] || '').trim();
                  if (value) safe[key] = value;
                });

                if (Object.keys(safe).length !== allowed.length) {
                  return TMPV3_response_({
                    ok:false,
                    status:'INCOMPLETE',
                    missing:allowed.filter(function(k){return !safe[k];})
                  });
                }

                PropertiesService.getScriptProperties().setProperties(safe, false);
                return TMPV3_response_({
                  ok:true,
                  status:'IMPORTED',
                  keyCount:Object.keys(safe).length
                });
              }

              if (body.action === 'verify') {
                var props = PropertiesService.getScriptProperties();
                var keys = [
                  'CLIENT_ID','CLIENT_SECRET','Striven_Customers_ReportAPI',
                  'Striven_CustomerLocations_ReportAPI','Striven_Contacts_ReportAPI',
                  'Striven_ApprovedSalesOrders_ReportAPI','Striven_DeliveryApprovedOrders_ReportAPI',
                  'Striven_InstallTasks_ReportAPI','Striven_DeliveryTasks_ReportAPI',
                  'Striven_ServiceTasks_ReportAPI','Striven_ServiceWorkOrders_ReportAPI'
                ];
                var missing=keys.filter(function(k){
                  return !String(props.getProperty(k)||'').trim();
                });
                return TMPV3_response_({
                  ok:missing.length===0,
                  status:missing.length?'CONFIG_GAPS':'CONFIG_READY',
                  keyCount:keys.length,
                  missing:missing
                });
              }

              return TMPV3_response_({ok:false,status:'UNKNOWN_ACTION'});
            } catch (err) {
              return TMPV3_response_({ok:false,status:'ERROR',message:String(err && err.message || err)});
            }
          }

          function TMPV3_response_(obj) {
            return ContentService.createTextOutput(JSON.stringify(obj))
              .setMimeType(ContentService.MimeType.JSON);
          }
JS
          )"

          PROD_JS="$(cat <<JS
          var TMPV3_RELAY_TOKEN = '$PROD_TOKEN';

          function doPost(e) {
            try {
              var body=JSON.parse(e && e.postData && e.postData.contents ? e.postData.contents : '{}');
              if (String(body.token||'') !== TMPV3_RELAY_TOKEN) {
                return TMPV3_relayResponse_({ok:false,status:'UNAUTHORIZED'});
              }
              if (body.action !== 'relay' || !body.targetUrl || !body.targetToken) {
                return TMPV3_relayResponse_({ok:false,status:'BAD_REQUEST'});
              }

              var props=PropertiesService.getScriptProperties();
              function first(keys) {
                for (var i=0;i<keys.length;i++) {
                  var value=String(props.getProperty(keys[i])||'').trim();
                  if (value) return value;
                }
                return '';
              }

              var serviceTasksFallback='';
              var serviceOrdersFallback='';
              try {
                serviceTasksFallback=String(SERVICE_TASKS.REPORTS.SERVICE_TASKS_URL||'');
                serviceOrdersFallback=String(SERVICE_TASKS.REPORTS.SERVICE_WORK_ORDERS_URL||'');
              } catch (ignored) {}

              var config={
                CLIENT_ID:first(['CLIENT_ID']),
                CLIENT_SECRET:first(['CLIENT_SECRET']),
                Striven_Customers_ReportAPI:first(['Striven_Customers_ReportAPI','STRIVEN_CUSTOMER_REPORT_API_KEY']),
                Striven_CustomerLocations_ReportAPI:first(['Striven_CustomerLocations_ReportAPI']),
                Striven_Contacts_ReportAPI:first(['Striven_Contacts_ReportAPI']),
                Striven_ApprovedSalesOrders_ReportAPI:first(['Striven_ApprovedSalesOrders_ReportAPI','Striven_CF_Approved_Sales_Orders_ReportAPI']),
                Striven_DeliveryApprovedOrders_ReportAPI:first(['Striven_DeliveryApprovedOrders_ReportAPI','Striven_CF_Delivery_Approved_Orders_ReportAPI']) ||
                  'https://api.striven.com/v2/reports/t6rYUCc9NSL8Pk1N77WvWe08NEkNIkcVekpgEoC39Qk4DPfrrhSKpRCY2UVHHA2HP1hvQHtMpyoRPKsjVPUQ',
                Striven_InstallTasks_ReportAPI:first(['Striven_InstallTasks_ReportAPI','Striven_Tasks_ReportAPI','Striven_CF_Installation_Tasks_ReportAPI']),
                Striven_DeliveryTasks_ReportAPI:first(['Striven_DeliveryTasks_ReportAPI']),
                Striven_ServiceTasks_ReportAPI:first(['Striven_ServiceTasks_ReportAPI']) || serviceTasksFallback,
                Striven_ServiceWorkOrders_ReportAPI:first(['Striven_ServiceWorkOrders_ReportAPI']) || serviceOrdersFallback
              };

              var missing=Object.keys(config).filter(function(k){return !String(config[k]||'').trim();});
              if (missing.length) {
                return TMPV3_relayResponse_({ok:false,status:'SOURCE_CONFIG_GAPS',missing:missing});
              }

              var response=UrlFetchApp.fetch(String(body.targetUrl),{
                method:'post',
                contentType:'application/json',
                payload:JSON.stringify({
                  token:String(body.targetToken),
                  action:'import',
                  config:config
                }),
                muteHttpExceptions:true
              });

              var code=response.getResponseCode();
              var parsed={};
              try { parsed=JSON.parse(response.getContentText()||'{}'); } catch (ignored) {}

              return TMPV3_relayResponse_({
                ok:code>=200 && code<300 && parsed.ok===true,
                status:'RELAY_COMPLETE',
                targetHttpCode:code,
                targetStatus:parsed.status||'UNKNOWN',
                targetKeyCount:Number(parsed.keyCount||0)
              });
            } catch (err) {
              return TMPV3_relayResponse_({ok:false,status:'ERROR',message:String(err && err.message || err)});
            }
          }

          function TMPV3_relayResponse_(obj) {
            return ContentService.createTextOutput(JSON.stringify(obj))
              .setMimeType(ContentService.MimeType.JSON);
          }
JS
          )"

          build_content "$TMP/v3-pre.json" "TMPV3_ConfigReceiver" "$V3_JS" "$TMP/v3-bootstrap.json" "V3_RECEIVER"
          build_content "$TMP/prod-pre.json" "TMPV3_ConfigRelay" "$PROD_JS" "$TMP/prod-relay.json" "PROD_RELAY"

          # ----------------------------------------------------------------
          # V3: temporary minimal receiver -> version -> restore HEAD -> deploy.
          # ----------------------------------------------------------------
          api_put_content "$V3_SCRIPT_ID" "$TMP/v3-bootstrap.json"
          api_create_version "$V3_SCRIPT_ID" "TMV3 temporary secure config receiver" "$TMP/v3-version.json"
          V3_VERSION="$(node -e 'const x=require(process.argv[1]); if(!x.versionNumber)process.exit(1); process.stdout.write(String(x.versionNumber))' "$TMP/v3-version.json")"
          api_put_content "$V3_SCRIPT_ID" "$TMP/v3-pre.json"
          test "$V3_PRE_HASH" = "$(api_get_content "$V3_SCRIPT_ID" "$TMP/v3-restored.json"; canonical_hash "$TMP/v3-restored.json")"

          api_create_deployment "$V3_SCRIPT_ID" "$V3_VERSION" "TMV3 temporary secure config receiver" "$TMP/v3-deploy.json"
          V3_DEPLOY="$(node -e 'const x=require(process.argv[1]); if(!x.deploymentId)process.exit(1); process.stdout.write(x.deploymentId)' "$TMP/v3-deploy.json")"
          V3_URL="https://script.google.com/macros/s/$V3_DEPLOY/exec"

          HEALTH="$(curl -fsSL -X POST -H 'Content-Type: application/json'             --data "$(TOKEN="$V3_TOKEN" node -e 'process.stdout.write(JSON.stringify({token:process.env.TOKEN,action:"health"}))')"             "$V3_URL")"

          printf '%s' "$HEALTH" | node -e '
            const fs=require("fs"),x=JSON.parse(fs.readFileSync(0,"utf8"));
            if(!x.ok || x.status!=="HEALTH_OK") throw new Error("V3 receiver health check failed");
          '

          # ----------------------------------------------------------------
          # Production: temporary relay version -> restore HEAD -> deploy.
          # ----------------------------------------------------------------
          api_put_content "$PROD_SCRIPT_ID" "$TMP/prod-relay.json"
          api_create_version "$PROD_SCRIPT_ID" "TMV3 temporary secure config relay" "$TMP/prod-version.json"
          PROD_VERSION="$(node -e 'const x=require(process.argv[1]); if(!x.versionNumber)process.exit(1); process.stdout.write(String(x.versionNumber))' "$TMP/prod-version.json")"
          api_put_content "$PROD_SCRIPT_ID" "$TMP/prod-pre.json"
          test "$PROD_PRE_HASH" = "$(api_get_content "$PROD_SCRIPT_ID" "$TMP/prod-restored.json"; canonical_hash "$TMP/prod-restored.json")"

          api_create_deployment "$PROD_SCRIPT_ID" "$PROD_VERSION" "TMV3 temporary secure config relay" "$TMP/prod-deploy.json"
          PROD_DEPLOY="$(node -e 'const x=require(process.argv[1]); if(!x.deploymentId)process.exit(1); process.stdout.write(x.deploymentId)' "$TMP/prod-deploy.json")"
          PROD_URL="https://script.google.com/macros/s/$PROD_DEPLOY/exec"

          RELAY_PAYLOAD="$(
            PROD_TOKEN="$PROD_TOKEN" V3_TOKEN="$V3_TOKEN" V3_URL="$V3_URL"             node -e 'process.stdout.write(JSON.stringify({
              token:process.env.PROD_TOKEN,
              action:"relay",
              targetUrl:process.env.V3_URL,
              targetToken:process.env.V3_TOKEN
            }))'
          )"

          RELAY_RESPONSE="$(curl -fsSL -X POST -H 'Content-Type: application/json' --data "$RELAY_PAYLOAD" "$PROD_URL")"
          printf '%s' "$RELAY_RESPONSE" | node -e '
            const fs=require("fs"),x=JSON.parse(fs.readFileSync(0,"utf8"));
            if(!x.ok || x.targetStatus!=="IMPORTED" || Number(x.targetKeyCount)!==11) {
              console.error(JSON.stringify({status:x.status,targetStatus:x.targetStatus,targetKeyCount:x.targetKeyCount}));
              process.exit(1);
            }
          '

          VERIFY="$(curl -fsSL -X POST -H 'Content-Type: application/json'             --data "$(TOKEN="$V3_TOKEN" node -e 'process.stdout.write(JSON.stringify({token:process.env.TOKEN,action:"verify"}))')"             "$V3_URL")"

          printf '%s' "$VERIFY" | node -e '
            const fs=require("fs"),x=JSON.parse(fs.readFileSync(0,"utf8"));
            if(!x.ok || x.status!=="CONFIG_READY" || Number(x.keyCount)!==11) {
              console.error(JSON.stringify({status:x.status,keyCount:x.keyCount,missing:x.missing||[]}));
              process.exit(1);
            }
          '

          # Final source parity before declaring success.
          api_get_content "$PROD_SCRIPT_ID" "$TMP/prod-final.json"
          api_get_content "$V3_SCRIPT_ID" "$TMP/v3-final.json"
          test "$PROD_PRE_HASH" = "$(canonical_hash "$TMP/prod-final.json")"
          test "$V3_PRE_HASH" = "$(canonical_hash "$TMP/v3-final.json")"

          node - "$OUT/evidence.json" <<'NODE'
          const fs=require('fs');
          fs.writeFileSync(process.argv[2],JSON.stringify({
            status:'V3_CONFIG_RELAY_VERIFIED',
            permanentPropertyCount:11,
            secretValuesPrinted:false,
            productionHeadRestoredAndHashVerified:true,
            v3HeadRestoredAndHashVerified:true,
            temporaryDeploymentsScheduledForDeletion:true,
            verifiedAt:new Date().toISOString()
          },null,2));
          NODE

          # Delete temp deployments now; cleanup trap is a second safety net.
          api_delete_deployment "$PROD_SCRIPT_ID" "$PROD_DEPLOY"
          PROD_DEPLOY=""
          api_delete_deployment "$V3_SCRIPT_ID" "$V3_DEPLOY"
          V3_DEPLOY=""

          trap - EXIT
          echo "V3_CONFIG_RELAY_VERIFIED"

      - name: Preserve non-secret relay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-secure-config-relay-${{ github.run_id }}
          path: autopatch-output-v3-config/
          if-no-files-found: warn
          retention-days: 30
