name: Final read-only verification of next week PreInspection
on:
  push:
    branches: [task_mapping]
    paths: ['ops/tmv3-next-week-final-verification.txt']
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/tmv3-next-week-final-verification.cjs
      - name: Verify eight live event plans and inspect actual blockers without task writes
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-next-week-final-verification.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-week-final-verification-${{ github.run_id }}
          path: next-week-final-verification/
          retention-days: 30
