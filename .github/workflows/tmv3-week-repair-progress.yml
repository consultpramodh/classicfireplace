name: Read weekly repair progress
on:
  push:
    branches: [task_mapping]
    paths: [ops/tmv3-week-repair-progress-trigger.txt]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/tmv3-week-repair-progress.cjs
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

# Check native audit outcomes during the authorized weekly repair.
