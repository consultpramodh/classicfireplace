name: Task Mapping Fix Pack R4

on:
  push:
    branches:
      - task_mapping
    paths:
      - release-candidates/task-mapping-fix-pack-r4.json

permissions:
  contents: read

concurrency:
  group: task-mapping-fix-pack-r4
  cancel-in-progress: false

jobs:
  guarded-task-mapping-fix-pack-r4:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google clasp CI authorization is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "CLASPRC_JSON repository secret is not configured. No Apps Script write attempted."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Run guarded R4 fix-pack deployment
        shell: bash
        run: node tools/deploy-task-mapping-fix-pack-r4.js release-candidates/task-mapping-fix-pack-r4.json

      - name: Preserve PRE source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-fix-pack-r4-${{ github.run_id }}
          path: task-mapping-r4-output/
          if-no-files-found: warn
          retention-days: 30
