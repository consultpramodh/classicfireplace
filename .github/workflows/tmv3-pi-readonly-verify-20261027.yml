name: Preinspection read-only verification 20261027
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-pi-readonly-verify-20261027.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run existing read-only verifier
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {profiles}=require('./tools/tmv3-execution-access-diagnostic.js');
          (async()=>{
            const p=profiles(JSON.parse(process.env.CLASPRC_JSON||'{}'));
            if(p.length!==1)throw Error('EXPECTED_ONE_PROFILE');
            const a=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',client_id:p[0].client,client_secret:p[0].secret,refresh_token:p[0].refresh}),redirect:'error'});
            if(!a.ok)throw Error('AUTH_HTTP_'+a.status);
            const token=(await a.json()).access_token;
            async function api(url,body){
              const r=await fetch(url,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(650000)});
              if(!r.ok)throw Error('GOOGLE_HTTP_'+r.status);
              return r.json();
            }
            const sid='1shaSL1CeNhR2-fr8H4x0fP2KUIjpOizLFyrNRAnGGXkCvERX4hZyJ5Gt';
            const base='https://script.googleapis.com/v1/';
            const inv=await api(base+'projects/'+sid+'/deployments');
            const deps=(inv.deployments||[]).filter(d=>(d.entryPoints||[]).some(e=>e.entryPointType==='EXECUTION_API'||e.executionApi));
            if(deps.length!==1)throw Error('EXECUTION_DEPLOYMENT_COUNT_'+deps.length);
            const response=await api(base+'scripts/'+encodeURIComponent(deps[0].deploymentId)+':run',{function:'tmv3_verifyPreInspectionAutomation',parameters:[],devMode:true});
            if(response.error||response.done!==true)throw Error('EXECUTION_FAILED:'+JSON.stringify(response.error||{}).slice(0,2000));
            fs.mkdirSync('pi-readonly-evidence',{recursive:true});
            fs.writeFileSync('pi-readonly-evidence/result.json',JSON.stringify(response.response.result,null,2));
            console.log('Verification returned; evidence stored as workflow artifact.');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-readonly-verify-${{ github.run_id }}
          path: pi-readonly-evidence/
          retention-days: 7
          if-no-files-found: warn
