name: Restore exact V3 source after transport failure
on:
  push:
    branches: [task_mapping]
    paths: [ops/tmv3-source-restore-trigger.txt]
permissions:
  contents: read
  actions: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: open-task-refresh-result-39629049596
          run-id: 39629049596
          github-token: ${{ github.token }}
          path: autopatch-output-sd-backfill-launch
      - name: Restore only the exact known temporary source
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-service-delivery-backfill-launch.js restore
