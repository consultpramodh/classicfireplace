name: Repair this week Install Delivery Service
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-week-repair-20261026.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check tools/tmv3-week-repair-release.cjs
      - name: Pull live source and prepare one-file scope extension
        run: node tools/tmv3-week-repair-release.cjs prepare
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-repair-PRE-${{ github.run_id }}
          path: week-repair-evidence/
          retention-days: 30
      - name: Test exact live-source candidate
        env:
          TMV3_TEST_SOURCE_DIR: week-repair-evidence/work
        run: |
          node tools/test-tmv3-week-scope.cjs
          node tools/test-tmv3-core-hardening.cjs
          node tools/test-tmv3-vertical-evidence.cjs
      - name: Push same project verify and execute weekly queues
        run: node tools/tmv3-week-repair-release.cjs apply
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-repair-result-${{ github.run_id }}
          path: week-repair-evidence/
          retention-days: 30
