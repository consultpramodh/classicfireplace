name: Verify one preinspection task and calendar event
on:
  push:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-one-event-readback.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current task plan and event link
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-one-event-readback.cjs

# Compare title fingerprints without exposing customer details.
