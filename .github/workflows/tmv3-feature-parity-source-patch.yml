name: TMV3 Feature Parity Source Patch

on:
  push:
    branches:
      - task_mapping
    paths:
      - 'ops/tmv3-parity-chunks/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmv3-feature-parity-source-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconstruct and validate V3 feature parity source
        shell: bash
        run: |
          set -euo pipefail
          cat ops/tmv3-parity-chunks/58_Operations.*.b64 | base64 -d | gzip -dc > apps-script/tmv3-clean/58_Operations.js
          cat ops/tmv3-parity-chunks/60_Automation.*.b64 | base64 -d | gzip -dc > apps-script/tmv3-clean/60_Automation.js

          echo "7cf539e8fc339592c4b6764fb53c692a001c8c2293c4bffc5a4c70b33dc8d6fc  apps-script/tmv3-clean/58_Operations.js" | sha256sum -c -
          echo "a11f306f6384d2994803238710c210c82e1a8140f264dab1362b66151646b41b  apps-script/tmv3-clean/60_Automation.js" | sha256sum -c -

          python ops/tmv3-parity-chunks/apply_patch.py

          for f in apps-script/tmv3-clean/*.js; do
            node --check "$f"
          done

          grep -q "manualWritesEnabled: true" apps-script/tmv3-clean/00_Config.js
          grep -q "automationWritesEnabled: false" apps-script/tmv3-clean/00_Config.js
          grep -q "field854Policy: 'MANAGED_WRITE_PRESERVE_OTHER_FIELDS'" apps-script/tmv3-clean/00_Config.js
          grep -q "function tmv3_syncSelectedAppointment" apps-script/tmv3-clean/58_Operations.js
          grep -q "function tmv3_createOrRecreateSelectedTask" apps-script/tmv3-clean/58_Operations.js
          grep -q "function tmv3_sendInstallMissingSoRemindersNow" apps-script/tmv3-clean/58_Operations.js
          grep -q "Push Date / Time" apps-script/tmv3-clean/60_Automation.js
          grep -q "tmv3_calendarEventUpdated: 4" apps-script/tmv3-clean/80_MorningOps.js

      - name: Commit V3 feature parity implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "consultpramodh"
          git config user.email "consultpramodh@gmail.com"
          git add apps-script/tmv3-clean release-candidates/tmv3-clean-bootstrap.json
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "task-mapping: restore V3 operational parity and manual controls"
          git push origin task_mapping
