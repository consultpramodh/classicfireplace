name: Task Mapping V3 Production Residue Cleanup

on:
  push:
    branches:
      - task_mapping
    paths:
      - 'release-candidates/tmv3-prod-residue-cleanup.json'
      - '.github/workflows/tmv3-prod-residue-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-mapping-production-source-guard
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task_mapping
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          npx -y @google/clasp@3.3.0 show-authorized-user --json >/dev/null

      - name: Remove only verified abandoned TMV3 shadow files
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID="1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m"
          CLASP_VERSION="3.3.0"
          TMP="$(mktemp -d)"
          PRE="$TMP/pre"
          WORK="$TMP/work"
          POST="$TMP/post"
          OUT="$GITHUB_WORKSPACE/autopatch-output-prod-cleanup"
          mkdir -p "$PRE" "$WORK" "$POST" "$OUT"

          (cd "$PRE" && npx -y "@google/clasp@$CLASP_VERSION" clone "$SCRIPT_ID" --rootDir src >/dev/null)
          cp -R "$PRE/." "$WORK/"

          TARGETS=(
            "TMV3_00_Config.js"
            "TMV3_01_Core.js"
            "TMV3_90_Diagnostics.js"
          )

          REMOVED=()
          for file in "${TARGETS[@]}"; do
            REMOTE="$PRE/src/$file"
            KNOWN="$GITHUB_WORKSPACE/apps-script/tmv3-shadow/$file"
            if [ -f "$REMOTE" ]; then
              if [ ! -f "$KNOWN" ]; then
                echo "Known GitHub reference missing for $file; refusing cleanup."
                exit 1
              fi
              if [ "$(sha256sum "$REMOTE" | awk '{print $1}')" != "$(sha256sum "$KNOWN" | awk '{print $1}')" ]; then
                echo "Remote $file differs from abandoned shadow copy; refusing cleanup."
                exit 1
              fi
              rm "$WORK/src/$file"
              REMOVED+=("$file")
            fi
          done

          if [ "${#REMOVED[@]}" -eq 0 ]; then
            printf '{"status":"NO_RESIDUE_FOUND","removed":[]}
' > "$OUT/evidence.json"
            exit 0
          fi

          # Hash-lock every unrelated production file before the cleanup.
          find "$PRE/src" -maxdepth 1 -type f -printf '%f
' | sort > "$TMP/pre-files.txt"
          : > "$TMP/preserved-hashes.txt"
          while IFS= read -r file; do
            skip=0
            for target in "${TARGETS[@]}"; do
              if [ "$file" = "$target" ]; then skip=1; fi
            done
            if [ "$skip" = "0" ]; then
              printf '%s %s
' "$(sha256sum "$PRE/src/$file" | awk '{print $1}')" "$file" >> "$TMP/preserved-hashes.txt"
            fi
          done < "$TMP/pre-files.txt"

          rollback() {
            echo "Cleanup verification failed; restoring exact PRE source."
            (cd "$PRE" && npx -y "@google/clasp@$CLASP_VERSION" push --force --delete >/dev/null) || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi; exit "$status"' EXIT

          (cd "$WORK" && npx -y "@google/clasp@$CLASP_VERSION" push --force --delete >/dev/null)
          (cd "$POST" && npx -y "@google/clasp@$CLASP_VERSION" clone "$SCRIPT_ID" --rootDir src >/dev/null)

          for target in "${REMOVED[@]}"; do
            if [ -f "$POST/src/$target" ]; then
              echo "Cleanup failed; $target still exists."
              exit 1
            fi
          done

          while read -r expected file; do
            test -f "$POST/src/$file"
            actual="$(sha256sum "$POST/src/$file" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected production change: $file"
              exit 1
            fi
          done < "$TMP/preserved-hashes.txt"

          REMOVED_CSV="$(IFS=,; echo "${REMOVED[*]}")"
          node - "$OUT/evidence.json" "$REMOVED_CSV" <<'NODE'
          const fs = require('fs');
          const [out, csv] = process.argv.slice(2);
          fs.writeFileSync(out, JSON.stringify({
            status: 'VERIFIED_RESIDUE_REMOVED',
            removed: csv ? csv.split(',') : [],
            unrelatedProductionFilesHashVerified: true,
            verifiedAt: new Date().toISOString()
          }, null, 2));
          NODE

          trap - EXIT
          echo "VERIFIED_RESIDUE_REMOVED"

      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-prod-residue-cleanup-${{ github.run_id }}
          path: autopatch-output-prod-cleanup/
          if-no-files-found: warn
          retention-days: 30
