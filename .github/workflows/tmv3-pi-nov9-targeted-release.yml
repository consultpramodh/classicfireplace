name: V3 PI Nov 9 targeted safe source release
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-pi-nov9-targeted-release.yml
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and review classifier regression tests
        run: |
          node --check tools/tmv3-pi-nov9-targeted-release.cjs
          node tools/test-tmv3-pi-calendar-review.cjs
      - name: Strict live HEAD hash and original-function parity
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-nov9-targeted-release.cjs dry-run
      - name: Update existing PI source only and readback
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-nov9-targeted-release.cjs deploy
