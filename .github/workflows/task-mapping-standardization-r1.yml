name: Task Mapping Standardization R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-mapping-standardization-r1
  cancel-in-progress: false

jobs:
  deploy-and-run:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "CLASPRC_JSON repository secret is not configured. No Apps Script write attempted."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Deploy guarded Standardization R1 source
        shell: bash
        run: node tools/deploy-task-mapping-standardization-r1.js

      - name: Configure remote runtime target
        shell: bash
        run: |
          cat > .clasp.json <<'JSON'
          {"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}
          JSON

      - name: Dry-run standardization
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run dryRunTaskMappingStandardizationR1 2>&1 | tee task-mapping-standardization-r1-output/dry-run.log

      - name: Apply standardization
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run runTaskMappingStandardizationR1 2>&1 | tee task-mapping-standardization-r1-output/runtime.log

      - name: Refresh live Code Audit Source
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run replaceCodeAuditSourceSheetFromProject 2>&1 | tee task-mapping-standardization-r1-output/code-audit-refresh.log

      - name: Preserve deployment and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-standardization-r1-${{ github.run_id }}
          path: task-mapping-standardization-r1-output/
          if-no-files-found: warn
          retention-days: 30
