name: PreInspection Rich Links R1.5.6 Nondev Apply

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/preinspect-rich-links-r1-5-6-nondev-trigger.txt

permissions:
  contents: read

concurrency:
  group: preinspect-rich-links-r1-5-6-nondev
  cancel-in-progress: false

jobs:
  apply-and-restore:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s\n' '{"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}' > .clasp.json
          mkdir -p preinspect-rich-links-r1-5-6-nondev-output

      - name: Verify live source and production deployment baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tm-rich-links-live
          mkdir -p /tmp/tm-rich-links-live
          (cd /tmp/tm-rich-links-live && npx -y @google/clasp@3.3.0 clone 1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m --rootDir src)

          node - <<'NODE'
          const fs=require('fs');
          const p='/tmp/tm-rich-links-live/src/99_Task_Mapping_Standardization_R1.js';
          const s=fs.readFileSync(p,'utf8');
          const required=[
            'TASK_MAPPING_STANDARDIZATION_R1_5_6_PREINSPECT_RICH_LINKS_20260922',
            'function applyPreInspectRichLinksR1_5_6()',
            'TM_STD_PREINSPECT_RICH_LINK_FIX_R156',
            'RICH_LINKS_VERIFIED'
          ];
          const missing=required.filter(x=>!s.includes(x));
          if(missing.length) throw new Error('Live R1.5.6 source incomplete: '+JSON.stringify(missing));
          if(/MailApp|GmailApp|sendEmail\(/.test(s)) throw new Error('Forbidden email-send surface detected.');
          console.log('LIVE_R1_5_6_SOURCE_VERIFIED');
          NODE

          npx -y @google/clasp@3.3.0 deployments --json | tee preinspect-rich-links-r1-5-6-nondev-output/pre-deployments.json

          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('preinspect-rich-links-r1-5-6-nondev-output/pre-deployments.json','utf8');
          const start=raw.indexOf('[');
          const arr=JSON.parse(raw.slice(start));
          const target=arr.find(x=>x.deploymentId==='AKfycbxCNxV4vsi002BCpoihsbjOLdJxs-vgoo_qbUCQ0mtd_QNw11cDxLtK2ThNlk2AiBuy');
          if(!target) throw new Error('Production API deployment not found.');
          if(Number(target.versionNumber)!==20) throw new Error('Expected production API deployment version 20, found '+JSON.stringify(target));
          console.log('PRODUCTION_DEPLOYMENT_BASELINE_VERIFIED_V20');
          NODE

      - name: Create temporary version, run rich links, restore v20
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DEPLOYMENT='AKfycbxCNxV4vsi002BCpoihsbjOLdJxs-vgoo_qbUCQ0mtd_QNw11cDxLtK2ThNlk2AiBuy'
          PREVIOUS_VERSION='20'
          PREVIOUS_DESCRIPTION='Website operations v3 - unified task links for Service, Inspection, Delivery, and Install'
          RESTORED=0

          restore() {
            code=$?
            echo "Restoring production API deployment to version $PREVIOUS_VERSION"
            if npx -y @google/clasp@3.3.0 deploy -i "$TARGET_DEPLOYMENT" -V "$PREVIOUS_VERSION" -d "$PREVIOUS_DESCRIPTION"; then
              RESTORED=1
              echo "PRODUCTION_DEPLOYMENT_RESTORED_V20"
            else
              echo "PRODUCTION_DEPLOYMENT_RESTORE_FAILED"
              exit 2
            fi
            exit "$code"
          }
          trap restore EXIT

          npx -y @google/clasp@3.3.0 version 'PreInspection R1.5.6 temporary rich-link runtime'
          npx -y @google/clasp@3.3.0 versions --json | tee preinspect-rich-links-r1-5-6-nondev-output/versions.json
          NEW_VERSION=$(node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('preinspect-rich-links-r1-5-6-nondev-output/versions.json','utf8');
          const start=raw.indexOf('[');
          const arr=JSON.parse(raw.slice(start));
          process.stdout.write(String(Math.max(...arr.map(x=>Number(x.versionNumber)||0))));
          NODE
          )
          test "$NEW_VERSION" -gt "$PREVIOUS_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" | tee preinspect-rich-links-r1-5-6-nondev-output/new-version.txt

          npx -y @google/clasp@3.3.0 deploy -i "$TARGET_DEPLOYMENT" -V "$NEW_VERSION" -d 'PreInspection R1.5.6 temporary rich-link runtime'

          set +e
          npx -y @google/clasp@3.3.0 run --nondev applyPreInspectRichLinksR1_5_6 2>&1 | tee preinspect-rich-links-r1-5-6-nondev-output/runtime.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "NONDEV_RUNTIME_PROCESS_FAILED"
            exit "$RC"
          fi
          if grep -Eiq 'Exception:|storage NOT_FOUND|ScriptError|Execution failed|(^|[^A-Za-z])Error:' preinspect-rich-links-r1-5-6-nondev-output/runtime.log; then
            echo "NONDEV_RUNTIME_ERROR_DETECTED"
            exit 1
          fi
          grep -q 'RICH_LINKS_VERIFIED' preinspect-rich-links-r1-5-6-nondev-output/runtime.log

          echo "RICH_LINKS_NONDEV_RUNTIME_VERIFIED" | tee preinspect-rich-links-r1-5-6-nondev-output/result.txt

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preinspect-rich-links-r1-5-6-nondev-${{ github.run_id }}
          path: preinspect-rich-links-r1-5-6-nondev-output/
          if-no-files-found: warn
          retention-days: 30
