name: Preinspection read-only today baseline
on:
  push:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-readonly-today-audit.yml]
permissions:
  contents: write
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current plans without event or task writes
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-readonly-today-audit.cjs

# Recheck today's unresolved events after schedule release.
