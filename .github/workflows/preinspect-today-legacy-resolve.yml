name: PreInspect Today Legacy Resolve

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/preinspect-today-legacy-resolve-trigger.txt

permissions:
  contents: write

concurrency:
  group: preinspect-today-legacy-resolve
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s\n' '{"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}' > .clasp.json
      - name: Capture live deployments and versions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/preinspect-today-result
          echo "CAPTURE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/preinspect-today-result/result.txt
          echo "===== DEPLOYMENTS =====" >> /tmp/preinspect-today-result/result.txt
          npx -y @google/clasp@3.3.0 deployments --json 2>&1 | tee -a /tmp/preinspect-today-result/result.txt
          echo "===== VERSIONS =====" >> /tmp/preinspect-today-result/result.txt
          npx -y @google/clasp@3.3.0 versions --json 2>&1 | tee -a /tmp/preinspect-today-result/result.txt
      - name: Commit diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p executions
          {
            echo "# PreInspect Today Legacy Resolve — deployment diagnostic"
            echo
            echo "Trigger commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '~~~text'
            cat /tmp/preinspect-today-result/result.txt 2>/dev/null || echo "No diagnostic result file was produced."
            echo '~~~'
          } > executions/preinspect-today-2026-09-24-latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executions/preinspect-today-2026-09-24-latest.md
          git commit -m "ops: record PreInspect legacy deployment diagnostic" || exit 0
          git push origin HEAD:task_mapping
