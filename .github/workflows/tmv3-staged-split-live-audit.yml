name: V3 staging - read-only live Apps Script source audit
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-staged-split-live-audit.yml
permissions:
  contents: read
concurrency:
  group: v3-staged-split-live-head-audit
  cancel-in-progress: false
jobs:
  read_live_head:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live Apps Script HEAD through read-only Apps Script API
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON is not configured. No Apps Script writes attempted."
            exit 1
          fi
          node tools/tmv3-service-delivery-backfill-launch.js inspect
      - name: Preserve hash-only inspection results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-live-head-hashes-${{ github.run_id }}
          path: autopatch-output-sd-backfill-launch/inspection.json
          retention-days: 7
