name: V3 staging - read-only live Apps Script source audit
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-staged-split-live-audit.yml
permissions:
  contents: read
concurrency:
  group: v3-staged-split-live-head-audit
  cancel-in-progress: false
jobs:
  read_live_head:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live Apps Script HEAD through read-only Apps Script API
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON is not configured. No Apps Script writes attempted."
            exit 1
          fi
          node - <<'NODE'
          const config=JSON.parse(process.env.CLASPRC_JSON||'{}');
          function find(o,keys){
            if(!o||typeof o!=='object')return '';
            for(const [k,v] of Object.entries(o))if(keys.includes(k)&&typeof v==='string'&&v)return v;
            for(const v of Object.values(o)){const s=find(v,keys);if(s)return s;}
            return '';
          }
          const data=new URLSearchParams({
            grant_type:'refresh_token',
            client_id:find(config,['clientId','client_id']),
            client_secret:find(config,['clientSecret','client_secret']),
            refresh_token:find(config,['refresh_token','refreshToken'])
          });
          if([...data.values()].some(v=>!v)){console.error('GOOGLE_OAUTH_DIAGNOSTIC=CONFIGURATION_FIELDS_MISSING');process.exit(1);}
          fetch('https://oauth2.googleapis.com/token',{method:'POST',body:data,redirect:'error',signal:AbortSignal.timeout(15000)}).then(async r=>{
            if(r.ok){console.log('GOOGLE_OAUTH_DIAGNOSTIC=REFRESH_OK');return;}
            const b=await r.json().catch(()=>({}));
            console.error('GOOGLE_OAUTH_DIAGNOSTIC='+JSON.stringify({http:r.status,error:String(b.error||'UNKNOWN').slice(0,90)}));
            process.exitCode=1;
          }).catch(e=>{console.error('GOOGLE_OAUTH_DIAGNOSTIC=NETWORK_OR_TIMEOUT');process.exitCode=1;});
          NODE
          node tools/tmv3-service-delivery-backfill-launch.js inspect
      - name: Preserve hash-only inspection results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-live-head-hashes-${{ github.run_id }}
          path: autopatch-output-sd-backfill-launch/inspection.json
          retention-days: 7
