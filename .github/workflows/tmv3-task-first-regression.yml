name: V3-001 Task-first Regression

on:
  push:
    branches:
      - fix/tmv3-task-first-relationships-20261013
    paths:
      - 'apps-script/tmv3-clean/**'
      - 'tools/test-tmv3-task-first-relationships.js'
      - 'tools/tmv3-shadow-run.js'
      - 'tools/test-tmv3-shadow-evidence.js'
      - 'tools/test-tmv3-task-first-temporary-gate.js'
      - 'tools/test-tmv3-step6-safe-block-verification.js'
      - 'tools/test-tmv3-calendar-link-task-name.js'
      - 'tools/test-tmv3-prepush-hardening.js'
      - 'tools/test-tmv3-task-first-canary-scope.js'
      - 'tools/test-tmv3-task-first-production-lane.js'
      - '.github/workflows/tmv3-task-first-regression.yml'
  pull_request:
    paths:
      - 'apps-script/tmv3-clean/**'
      - 'tools/test-tmv3-task-first-relationships.js'
      - 'tools/tmv3-shadow-run.js'
      - 'tools/test-tmv3-shadow-evidence.js'
      - 'tools/test-tmv3-task-first-temporary-gate.js'
      - 'tools/test-tmv3-step6-safe-block-verification.js'
      - 'tools/test-tmv3-calendar-link-task-name.js'
      - 'tools/test-tmv3-prepush-hardening.js'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check V3 Apps Script syntax
        run: |
          for file in apps-script/tmv3-clean/*.js; do node --check "$file"; done
      - name: PreInspection shared customer-number regression
        run: node tools/test-tmv3-preinspection-notification-evidence.js
      - name: Task-first relationship mock regression
        run: |
          node tools/test-tmv3-task-first-relationships.js
          node tools/test-tmv3-task-first-canary-scope.js
          node tools/test-tmv3-task-first-production-lane.js
          node tools/test-tmv3-shadow-evidence.js
          node tools/test-tmv3-task-first-temporary-gate.js
          node tools/test-tmv3-step6-safe-block-verification.js
          node tools/test-tmv3-calendar-link-task-name.js
          node tools/test-tmv3-prepush-hardening.js
