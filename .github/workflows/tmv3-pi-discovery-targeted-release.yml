name: Deploy Preinspection discovery and targeted intake
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-pi-discovery-targeted-release.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned candidate
        run: |
          git fetch origin cbce941943dda45c0f1a9d59fe286de895ff03d7
          for file in apps-script/tmv3-clean/00_Config.js apps-script/tmv3-clean/60_Automation.js tools/test-tmv3-pi-order-classification.cjs tools/test-tmv3-pi-discovery.cjs tests/preinspection/sweep-start-recovery.test.cjs tests/preinspection/targeted-intake.test.cjs; do
            mkdir -p "$(dirname "$file")"
            git show cbce941943dda45c0f1a9d59fe286de895ff03d7:"$file" > "$file"
          done
      - name: Test and deploy
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-discovery-targeted-release.cjs
