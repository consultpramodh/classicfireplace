name: Terry Pre-Inspection read-only intake preview
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-terry-readonly-preview-20261110.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and run guarded preview
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const {profiles}=require('./tools/tmv3-execution-access-diagnostic.js');
          const {canonical}=require('./tools/tmv3-relationship-function-patch.js');
          const sid='1shaSL1CeNhR2-fr8H4x0fP2KUIjpOizLFyrNRAnGGXkCvERX4hZyJ5Gt';
          const expected='84a40ee36c916e483f005a6ec02c9574396a460c4fb2f2abc61980d4e6c9a829';
          (async()=>{
            const p=profiles(JSON.parse(process.env.CLASPRC_JSON||'{}'));if(p.length!==1)throw Error('PROFILE_COUNT');
            const auth=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',client_id:p[0].client,client_secret:p[0].secret,refresh_token:p[0].refresh})});if(!auth.ok)throw Error('AUTH');
            const token=(await auth.json()).access_token;
            async function api(url,options={}){const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},signal:AbortSignal.timeout(180000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()}
            const root='https://script.googleapis.com/v1/projects/'+sid;const src=await api(root+'/content');if(canonical(src)!==expected)throw Error('SOURCE_DRIFT_NO_RUN');
            const ds=(await api(root+'/deployments')).deployments.filter(d=>(d.entryPoints||[]).some(e=>e.entryPointType==='EXECUTION_API'||e.executionApi));if(ds.length!==1)throw Error('DEPLOYMENT_COUNT');
            const v=await api('https://script.googleapis.com/v1/scripts/'+encodeURIComponent(ds[0].deploymentId)+':run',{method:'POST',body:JSON.stringify({function:'tmv3_previewTerryQuietCalendarIntake',parameters:[],devMode:true})});
            if(!v.done||v.error)throw Error('PREVIEW_FAILED');
            const x=v.response&&v.response.result;if(!x)throw Error('NO_RESULT');
            console.log(JSON.stringify({status:x.status,guestWrites:x.guestWrites,emailSends:x.emailSends,strivenWrites:x.strivenWrites,taskCreates:x.taskCreates,hasCopy:!!x.copyId}));
          })().catch(e=>{console.error(JSON.stringify({status:'BLOCKED',reason:e.message}));process.exitCode=1});
          NODE
