name: Inspect V3 triggers and legacy schedule parity
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-trigger-parity-inspect.yml, ops/tmv3-trigger-parity-inspect.txt]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/tmv3-trigger-parity-inspect.cjs
      - name: Inspect live triggers and legacy sources
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-trigger-parity-inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trigger-parity-${{ github.run_id }}
          path: trigger-parity-evidence/
          retention-days: 30
