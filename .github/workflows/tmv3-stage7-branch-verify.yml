name: TMV3 Stage 7 Branch Verify

on:
  push:
    branches:
      - task_mapping_autopatch_stage7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmv3-stage7-branch-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task_mapping_autopatch_stage7
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check clean V3 source
        shell: bash
        run: |
          set -euo pipefail
          for f in apps-script/tmv3-clean/*.js; do
            node --check "$f"
          done
          node --check tools/tmv3-shadow-run.js

      - name: Verify Step 7 remains read-only
        shell: bash
        run: |
          set -euo pipefail
          F="apps-script/tmv3-clean/46_Step7_Reconciliation.js"

          grep -q "SHADOW_ONLY__NO_WRITES" "$F"
          grep -q "taskWritesPerformed: false" "$F"
          grep -q "calendarWritesPerformed: false" "$F"
          grep -q "strivenWritesPerformed: false" "$F"

          if grep -Eiq "method:[[:space:]]*['\"](post|put|patch|delete)['\"]" "$F"; then
            echo "Step 7 contains an HTTP mutation method."
            exit 1
          fi

          if grep -Eq "tmv3_(executeExistingTaskSync_|createOrRecreateFromBundle_|operationWrite|reconcileTaskAssignments_)" "$F"; then
            echo "Step 7 calls an operational mutation helper."
            exit 1
          fi

      - name: Verify Stage 7 scheduler gates
        shell: bash
        run: |
          set -euo pipefail
          F="apps-script/tmv3-clean/60_Automation.js"

          COUNT="$(grep -c "tmv3_executionStage_() <= 7" "$F")"
          if [ "$COUNT" -lt 3 ]; then
            echo "Expected Stage 7 write/reminder gates were not found."
            exit 1
          fi

          grep -q "stage === 7" "$F"
          grep -q "STAGE7_RECONCILIATION_VIEW_REFRESH" "$F"
          grep -q "DAILY_STAGE7_RECONCILIATION_VIEW_REFRESH" "$F"

      - name: Verify Stage 7 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TMV3_EXECUTION_STAGE = 7" apps-script/tmv3-clean/00_Config.js
          grep -q "3.8.0-step7-reconciliation-plan-r1" apps-script/tmv3-clean/00_Config.js
          grep -q "RECONCILE: 'TM Reconcile'" apps-script/tmv3-clean/00_Config.js
          grep -q "function tmv3_step7ReconciliationRun" apps-script/tmv3-clean/46_Step7_Reconciliation.js
          grep -q "function tmv3_step4LinkedTaskLocation_" apps-script/tmv3-clean/38_Step4_Identity.js
          grep -q "RUN_MODE === 'STEP7_INSTALL'" tools/tmv3-shadow-run.js

      - name: Verify protected Pre-Inspection rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "descriptionMustBeBlankAtCreate: true" apps-script/tmv3-clean/00_Config.js
          grep -q "attachOrderToTask: false" apps-script/tmv3-clean/00_Config.js
          grep -q "defaultPoolId: 8" apps-script/tmv3-clean/00_Config.js
          grep -q "requestedByFromOrganizer: true" apps-script/tmv3-clean/00_Config.js
