name: Install verified native V3 trigger schedules
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-install-native-triggers.yml, ops/tmv3-install-native-triggers.txt]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/tmv3-install-native-triggers.cjs
      - name: Verify exact source and capture pre-install inventory
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-install-native-triggers.cjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: native-triggers-PRE-${{ github.run_id }}
          path: trigger-install-evidence/
          retention-days: 30
      - name: Install native schedules and independently read back
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-install-native-triggers.cjs install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-triggers-result-${{ github.run_id }}
          path: trigger-install-evidence/
          retention-days: 30
