# R4.7 Field 854 canonical v1 verification
name: Task Mapping Fix Pack R4.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task-mapping-r4-1-dispatch.yml

permissions:
  contents: read

concurrency:
  group: task-mapping-fix-pack-r4-7
  cancel-in-progress: false

jobs:
  deploy-r4-7:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google clasp CI authorization is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "CLASPRC_JSON repository secret is not configured. No Apps Script write attempted."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Build R4.7 runtime manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('release-candidates/task-mapping-fix-pack-r4.json', 'utf8'));
          m.release = 'TASK_MAPPING_FIX_PACK_R4_7_20260915';
          m.expectedPreFileCount = 59;
          fs.writeFileSync('r4-7-runtime-manifest.json', JSON.stringify(m, null, 2));
          NODE

      - name: Run guarded R4.7 Field 854 canonical verification deployment
        shell: bash
        run: node tools/deploy-task-mapping-fix-pack-r4-7.js r4-7-runtime-manifest.json

      - name: Preserve PRE source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-fix-pack-r4-7-${{ github.run_id }}
          path: task-mapping-r4-7-output/
          if-no-files-found: warn
          retention-days: 30
