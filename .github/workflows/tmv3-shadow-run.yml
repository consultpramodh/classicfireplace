name: Task Mapping V3 Shadow Verification

on:
  push:
    branches:
      - task_mapping
    paths:
      - 'release-candidates/tmv3-shadow-run.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task_mapping
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate shadow runner
        run: node --check tools/tmv3-shadow-run.js

      - name: Determine shadow run mode
        shell: bash
        run: |
          MODE="$(node -e "const m=require('./release-candidates/tmv3-shadow-run.json'); process.stdout.write(String(m.runMode||'FULL'))")"
          BATCH_OFFSET="$(node -e "const m=require('./release-candidates/tmv3-shadow-run.json'); process.stdout.write(String(m.batchOffset||0))")"
          BATCH_LIMIT="$(node -e "const m=require('./release-candidates/tmv3-shadow-run.json'); process.stdout.write(String(m.batchLimit||0))")"
          echo "TMV3_SHADOW_RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "TMV3_STEP7_BATCH_OFFSET=$BATCH_OFFSET" >> "$GITHUB_ENV"
          echo "TMV3_STEP7_BATCH_LIMIT=$BATCH_LIMIT" >> "$GITHUB_ENV"

      - name: Run guarded V3 shadow verification
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-shadow-run.js

      - name: Publish V3-001 acceptance outcome
        if: always() && env.TMV3_SHADOW_RUN_MODE == 'TASK_FIRST_NO_CHANGE'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/v3-001-result.md
          import json, pathlib, os
          path=pathlib.Path("autopatch-output-v3-shadow/evidence.json")
          print("V3-001 Task 19081 no-change acceptance, run #"+os.environ.get("GITHUB_RUN_ID","?"))
          if not path.exists():
              print("RESULT: NO_EVIDENCE — workflow failed before verified result")
          else:
              result=json.loads(path.read_text())
              step=result.get("step1") or {}
              raw=step.get("result") if isinstance(step,dict) else {}
              if not isinstance(raw,dict): raw={}
              print("RESULT:", raw.get("status",step.get("status","UNKNOWN")) if isinstance(step,dict) else "UNKNOWN")
              print("EXPECTED: NO_CHANGE_VERIFIED")
              print("Full evidence retained in the workflow artifact; no task mutation authorized.")
          PY
          gh issue comment 114 --repo consultpramodh/classicfireplace --body-file /tmp/v3-001-result.md

      - name: Preserve shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-shadow-run-${{ github.run_id }}
          path: autopatch-output-v3-shadow/
          if-no-files-found: warn
          retention-days: 30
