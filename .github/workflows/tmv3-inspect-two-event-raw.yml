name: Inspect event notes before repair
on:
  push:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-inspect-two-event-raw.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read encrypted event snapshots
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-inspect-two-event-raw.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-two-events
          path: two-events.enc
          retention-days: 1

# Verify post-repair raw notes.
