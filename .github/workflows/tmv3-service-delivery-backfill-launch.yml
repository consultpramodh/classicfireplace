name: Launch fixed Service Delivery Order backfill
on:
  push:
    branches: [task_mapping]
    paths: [ops/tmv3-sd-backfill-launch-trigger.txt]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TMV3_BACKFILL_LAUNCH_KIND: CACHE_REPAIR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated native launch
        run: |
          node --check tools/tmv3-service-delivery-backfill-launch.js
          node tools/test-tmv3-service-delivery-order-backfill.js
          node tools/test-tmv3-service-delivery-backfill-launch.js
          node tools/test-tmv3-service-delivery-cache-reconcile.js
      - name: Read exact canonical source before temporary HEAD launch
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-service-delivery-backfill-launch.js prepare
      - name: Preserve source backup before temporary source mutation
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-sd-backfill-launch-PRE-${{ github.run_id }}
          path: autopatch-output-sd-backfill-launch/
          if-no-files-found: error
          retention-days: 30
      - name: Launch fixed backlog on existing HEAD and restore exact canonical source
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-service-delivery-backfill-launch.js run
      - name: Preserve launch outcome and temporary source backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmv3-sd-backfill-launch-result-${{ github.run_id }}
          path: autopatch-output-sd-backfill-launch/
          if-no-files-found: warn
          retention-days: 30
