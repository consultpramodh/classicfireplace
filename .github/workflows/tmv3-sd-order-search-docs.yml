name: Read official Striven Task search schema
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-sd-order-search-docs.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Task search schemas and official status list
        run: |
          node --input-type=module <<'JS'
          for(const version of ['v1','v2']){
            const r=await fetch('https://api.striven.com/swagger/'+version+'/swagger.json');
            if(!r.ok){console.log(version+' HTTP '+r.status);continue;}
            const j=await r.json(),op=j.paths['/v2/tasks/search']||j.paths['/v1/tasks/search'];
            const models={};
            function follow(value,depth){if(!value||typeof value!=='object'||depth>5)return;for(const[k,v]of Object.entries(value)){if(k==='$ref'&&typeof v==='string'){const name=v.split('/').pop();if(!models[name]){models[name]=j.components.schemas[name];follow(models[name],depth+1);}}else follow(v,depth);}}
            if(op){follow(op,0);console.log(JSON.stringify({version,operation:op,models}));}
            else console.log(JSON.stringify({version,paths:Object.keys(j.paths).filter(p=>/task.*search|static/i.test(p))}));
          }
          JS
