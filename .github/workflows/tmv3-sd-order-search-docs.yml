name: Read official Striven Order search schema
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-sd-order-search-docs.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read official OpenAPI search request and response models only
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.striven.com/swagger/v1/swagger.json');
          if(!r.ok)throw Error('DOCS_HTTP_'+r.status);
          const j=await r.json(),op=j.paths['/v1/sales-orders/search'];
          console.log(JSON.stringify({path:'/v1/sales-orders/search',operation:op}));
          const schemas={};
          function follow(value,depth){
            if(!value||typeof value!=='object'||depth>5)return;
            for(const [k,v] of Object.entries(value)){
              if(k==='$ref'&&typeof v==='string'){
                const name=v.split('/').pop();
                const model=j.components.schemas[name];
                if(!schemas[name]){schemas[name]=model;follow(model,depth+1);}
              }else follow(v,depth);
            }
          }
          follow(op.post.requestBody,0);
          console.log(JSON.stringify({requestSchemas:schemas}));
          const responses={};for(const [name,model]of Object.entries(j.components.schemas))if(/SalesOrder.*(Search|List)|Paged.*SalesOrder/i.test(name))responses[name]=model;
          console.log(JSON.stringify({responseSchemas:responses}));
          JS
