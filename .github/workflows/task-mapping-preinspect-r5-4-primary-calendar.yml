name: Task Mapping PreInspect R5.4 Primary Calendar

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/preinspect-r5-4-primary-calendar-trigger.txt

permissions:
  contents: read

concurrency:
  group: task-mapping-preinspect-r5-4-primary-calendar
  cancel-in-progress: false

jobs:
  guarded-preinspect-r5-4-primary-calendar:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google clasp CI authorization is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "CLASPRC_JSON repository secret is not configured. No Apps Script write attempted."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Fix R5.4 deployer worktree sequencing in runner copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/deploy-preinspect-r5-4-primary-calendar.js')
          s = p.read_text()
          old = """  fs.cpSync(F,W,{recursive:true,force:true});
            const wsrc=path.join(W,'src');
            fs.copyFileSync(f35,path.join(wsrc,'35_PreInspect_Task_Review.js'));
            fs.copyFileSync(f36,path.join(wsrc,'36_PreInspect_Task_Create.js'));
            fs.copyFileSync(f96,path.join(wsrc,'96_Selected_Row_End_To_End_R3.js'));
          """
          if old not in s:
              raise SystemExit('Expected R5.4 sequencing block not found; refusing deployment.')
          s = s.replace(old, "  // Freshness clone matched PRE; keep patched WORK tree intact for push.\n")
          p.write_text(s)
          PY
          node --check tools/deploy-preinspect-r5-4-primary-calendar.js

      - name: Run guarded PreInspect R5.4 primary-calendar deployment
        shell: bash
        run: node tools/deploy-preinspect-r5-4-primary-calendar.js

      - name: Preserve PRE source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-preinspect-r5-4-primary-calendar-${{ github.run_id }}
          path: task-mapping-preinspect-r5-4-primary-calendar-output/
          if-no-files-found: warn
          retention-days: 30
