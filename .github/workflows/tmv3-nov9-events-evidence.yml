name: PI Nov 9 three appointments read only Striven evidence
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-nov9-events-evidence.yml
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  read_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only inspector syntax
        run: node --check tools/tmv3-preinspection-pending-review.cjs
      - name: Run existing read-only preinspection event verification
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-preinspection-pending-review.cjs
      - name: Save diagnostic evidence (no writes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov9-pi-three-appointments-${{ github.run_id }}
          path: preinspection-pending-review/result.json
          retention-days: 7
