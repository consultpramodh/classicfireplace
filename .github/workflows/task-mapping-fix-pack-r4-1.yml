name: Task Mapping Fix Pack R4.1

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/task-mapping-r4-1-trigger.txt

permissions:
  contents: read

concurrency:
  group: task-mapping-fix-pack-r4-1
  cancel-in-progress: false

jobs:
  guarded-task-mapping-fix-pack-r4-1:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google clasp CI authorization is configured
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "CLASPRC_JSON repository secret is not configured. No Apps Script write attempted."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Build R4.1 runtime manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('release-candidates/task-mapping-fix-pack-r4.json', 'utf8'));
          m.release = 'TASK_MAPPING_FIX_PACK_R4_1_20260915';
          m.expectedPreFileCount = 59;
          m.targetFile = '97_Task_Mapping_Fix_Pack_R4.js';
          fs.writeFileSync('r4-1-runtime-manifest.json', JSON.stringify(m, null, 2));
          NODE

      - name: Run guarded R4.1 Service Calendar fix deployment
        shell: bash
        run: node tools/deploy-task-mapping-fix-pack-r4-1.js r4-1-runtime-manifest.json

      - name: Preserve PRE source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-fix-pack-r4-1-${{ github.run_id }}
          path: task-mapping-r4-1-output/
          if-no-files-found: warn
          retention-days: 30
