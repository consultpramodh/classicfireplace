name: Test Preinspection incomplete discovery
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-pi-discovery-review-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94737640b5e8c59848d7d253362004864493e635
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check apps-script/tmv3-clean/60_Automation.js
          node tools/test-tmv3-pi-discovery.cjs
          node tools/test-tmv3-pi-order-classification.cjs
          node tools/test-tmv3-core-hardening.cjs
          node tests/preinspection/sweep-start-recovery.test.cjs
          node tests/preinspection/targeted-intake.test.cjs
