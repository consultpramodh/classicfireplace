name: Release V3 standard slot schedule
on:
  push:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-standard-slots-release.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Back up, validate, deploy, and verify schedule
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-slot-schedule-release.cjs

# Apply only if the live source matches the independently verified private backup.
