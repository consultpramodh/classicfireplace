name: Repair one calendar link
on:
  pull_request:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-remove-extra-link.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only extra order link and verify
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const {profiles}=require('./tools/tmv3-execution-access-diagnostic.js');
          (async()=>{
            const p=profiles(JSON.parse(process.env.CLASPRC_JSON||'{}'));if(p.length!==1)throw Error('ONE_PROFILE_REQUIRED');
            const a=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',client_id:p[0].client,client_secret:p[0].secret,refresh_token:p[0].refresh})});if(!a.ok)throw Error('AUTH_FAILED');
            const headers={Authorization:'Bearer '+(await a.json()).access_token},cal='classicfireplace.ca_vpg05s56lp9f7kaegsiqask34o@group.calendar.google.com',id='3murnedmvr6fspuruv84qqcc0f';
            const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal)+'/events/'+encodeURIComponent(id);const g=await fetch(url,{headers});if(!g.ok)throw Error('READ_FAILED_'+g.status);const e=await g.json();
            const order='<a href="https://classicfireplace.striven.com/next/crm#/sales-orders/28232">Sales Order #586497</a><br>',task='https://classicfireplace.striven.com/Tasks/TaskInfo.aspx?TaskID=19529';
            if(!e.etag||!e.description||!e.description.includes(task)||!e.summary.includes('SO#586497'))throw Error('GUARD_FAILED');
            const count=e.description.split(order).length-1;if(count>1)throw Error('MULTIPLE_ORDER_LINKS');if(count===0){console.log(JSON.stringify({status:'ALREADY_REMOVED',taskPresent:true}));return;}
            const next=e.description.replace(order,'');const pch=await fetch(url,{method:'PATCH',headers:{...headers,'Content-Type':'application/json','If-Match':e.etag},body:JSON.stringify({description:next})});if(!pch.ok)throw Error('PATCH_FAILED_'+pch.status);
            const v=await fetch(url,{headers});if(!v.ok)throw Error('VERIFY_READ_FAILED');const saved=await v.json();if(saved.description!==next)throw Error('DESCRIPTION_MISMATCH');
            console.log(JSON.stringify({status:'VERIFIED',originalNotesUnchanged:true,taskLinkPreserved:saved.description.includes(task),orderLinkRemoved:!saved.description.includes('sales-orders/28232'),otherFieldsUnchanged:saved.summary===e.summary&&saved.location===e.location&&saved.start.dateTime===e.start.dateTime&&saved.end.dateTime===e.end.dateTime}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
