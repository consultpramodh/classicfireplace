name: Task Mapping Contact R1 Runtime Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          echo -n "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo '{"scriptId":"1E86mhD2dZcOFpqWnCvoIpwEkwZ0MA63MgM8DifV6WyB2FvVQkRWKIZ_m","rootDir":"."}' > .clasp.json

      - name: Shared Contact resolver against explicit live workbook
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run testTmContactR1ResolverRemote 2>&1 | tee /tmp/contact-test.log
          if grep -Eqi "error:|exception:" /tmp/contact-test.log; then exit 1; fi

      - name: Rebuild Service mapping against explicit live workbook
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run testTmContactR1RebuildServiceRemote 2>&1 | tee /tmp/service-rebuild.log
          if grep -Eqi "error:|exception:" /tmp/service-rebuild.log; then exit 1; fi

      - name: Rebuild Install mapping against explicit live workbook
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run testTmContactR1RebuildInstallRemote 2>&1 | tee /tmp/install-rebuild.log
          if grep -Eqi "error:|exception:" /tmp/install-rebuild.log; then exit 1; fi

      - name: Read final Contact coverage
        shell: bash
        run: |
          set -o pipefail
          npx -y @google/clasp@3.3.0 run testTmContactR1CoverageRemote 2>&1 | tee /tmp/coverage.log
          if grep -Eqi "error:|exception:" /tmp/coverage.log; then exit 1; fi
