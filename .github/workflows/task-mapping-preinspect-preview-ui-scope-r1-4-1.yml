name: Task Mapping PreInspection Preview UI Scope R1.4.1

on:
  push:
    branches:
      - task_mapping
    paths:
      - ops/task-mapping-preinspect-preview-ui-scope-r1-4-1-trigger.txt

permissions:
  contents: read

concurrency:
  group: task-mapping-preinspect-preview-ui-scope-r1-4-1
  cancel-in-progress: false

jobs:
  guarded-deploy:
    if: github.repository == 'consultpramodh/classicfireplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical Task Mapping branch
        uses: actions/checkout@v4
        with:
          ref: task_mapping
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure clasp authorization
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASPRC_JSON:-}"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Add container UI scope
        shell: bash
        run: node tools/deploy-preinspect-preview-ui-scope-r1-4-1.js

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-mapping-preinspect-preview-ui-scope-${{ github.run_id }}
          path: task-mapping-preinspect-preview-ui-scope-output/
          if-no-files-found: warn
          retention-days: 30
