name: V3 PI - bounded cache diagnostic guarded release
on:
  push:
    branches:
      - staging/v3-vertical-split-20261109
    paths:
      - .github/workflows/tmv3-pi-owner-assignment-release.yml
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded cache diagnostic regression and release syntax
        run: |
          node --check tools/tmv3-pi-diagnostic-release.cjs
          node tools/test-tmv3-preinspection-owner.cjs
          node tools/test-tmv3-pi-calendar-review.cjs
          node tools/test-tmv3-pi-diagnostic.cjs
      - name: Require exact live Apps Script HEAD and 688 unchanged functions
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-diagnostic-release.cjs dry-run
      - name: Deploy PI diagnostic only with source readback
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/tmv3-pi-diagnostic-release.cjs deploy
