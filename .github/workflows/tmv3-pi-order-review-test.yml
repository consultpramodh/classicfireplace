name: Test Preinspection order classification
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-pi-order-review-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3162db0bbaa6bb21df5b8b42c3839b5298d1edea
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check apps-script/tmv3-clean/60_Automation.js
          node tools/test-tmv3-pi-order-classification.cjs
          node tools/test-tmv3-pi-discovery.cjs
          node tools/test-tmv3-core-hardening.cjs
          node tests/preinspection/sweep-start-recovery.test.cjs
