name: One-time Service linked task check
on:
  pull_request:
    branches: [task-mapping-preinspection]
    paths: [.github/workflows/tmv3-service-linked-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate Service records without task or calendar mutations
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const {profiles}=require('./tools/tmv3-execution-access-diagnostic.js');
          (async()=>{
            const p=profiles(JSON.parse(process.env.CLASPRC_JSON||'{}'));if(p.length!==1)throw Error('ONE_PROFILE_REQUIRED');
            const a=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',client_id:p[0].client,client_secret:p[0].secret,refresh_token:p[0].refresh})});if(!a.ok)throw Error('AUTH_FAILED');
            const h={Authorization:'Bearer '+(await a.json()).access_token},sid='1shaSL1CeNhR2-fr8H4x0fP2KUIjpOizLFyrNRAnGGXkCvERX4hZyJ5Gt';
            const d=await fetch('https://script.googleapis.com/v1/projects/'+sid+'/deployments',{headers:h});if(!d.ok)throw Error('DEPLOYMENTS_READ_FAILED');const apis=((await d.json()).deployments||[]).filter(x=>(x.entryPoints||[]).some(e=>e.executionApi));if(apis.length!==1)throw Error('EXECUTION_API_NOT_UNIQUE');
            const ids=['0smr3vc6d3hj3qtauorna3tbde@google.com','22fpu12hevifpskdgpu6nnjf3s@google.com','51b07e4n5urkn84b2sm9irhne7@google.com','2dpbplt54mg7l5g0jalc8qqb0t@google.com'];
            const r=await fetch('https://script.googleapis.com/v1/scripts/'+encodeURIComponent(apis[0].deploymentId)+':run',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({function:'tmv3_verticalLinkedTaskDiagnostics',parameters:['Service',ids],devMode:true}),signal:AbortSignal.timeout(750000)});const x=await r.json();if(!r.ok||x.error)throw Error('DIAGNOSTIC_FAILED '+JSON.stringify(x.error||r.status));const v=x.response&&x.response.result;if(!Array.isArray(v)||v.length!==ids.length)throw Error('INCOMPLETE_RESULTS');console.log(JSON.stringify({status:'LINKED_TASK_READ',results:v.map((row,i)=>({case:i+1,error:row.error||'',identity:row.identity,expectedCustomer:row.expectedCustomer,expectedLocation:row.expectedLocation,locationStatus:row.locationStatus,linkedId:row.linkedId,fresh:row.fresh&&{ok:row.fresh.ok,error:row.fresh.error,taskId:row.fresh.task&&row.fresh.task['Task ID'],customerId:row.fresh.task&&row.fresh.task['Customer ID'],locationId:row.fresh.task&&row.fresh.task['Location ID'],orderId:row.fresh.task&&row.fresh.task['Order ID'],taskStatus:row.fresh.task&&row.fresh.task['Status']}}))}));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
