name: Sync one verified Install customer and task
on:
  push:
    branches: [task_mapping]
    paths: [.github/workflows/tmv3-jim-profile-read-only.yml]
permissions:
  contents: read
concurrency:
  group: task-mapping-v3-clean-bootstrap
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
