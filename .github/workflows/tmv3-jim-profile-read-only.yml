          const helper="function tmv3_jimProfileReadOnly20261026() {\n var stage='calendar';try {\n var events=CalendarApp.getCalendarById('classicfireplace.ca_vpg05s56lp9f7kaegsiqask34o@group.calendar.google.com').getEvents(new Date('2026-10-27T00:00:00-04:00'),new Date('2026-10-28T00:00:00-04:00'));\n var matched=events.filter(function(e){return /Jim Farquhar/i.test(e.getTitle()) && /585742/.test(e.getTitle());});\n if(matched.length!==1)throw Error('EVENT_NOT_UNIQUE');\n var phone=tmv3_phone10_(tmv3_extractPhone_(matched[0].getTitle()));\n if(phone.length!==10)throw Error('CALENDAR_PHONE_UNRESOLVED');\n stage='task';var task=tmv3_getTaskById_(18978),cid=String(task['Customer ID']||''),oid=String(task['Order ID']||'');\n if(!/^[1-9][0-9]*$/.test(cid)||!/^[1-9][0-9]*$/.test(oid)||!/Farquhar/i.test(task.Name||''))throw Error('TASK_IDENTITY_UNPROVEN');\n stage='order';var order=tmv3_fetchJson_(TMV3.API_BASE+'/v1/sales-orders/'+oid,{method:'get'});\n var oc=order.Customer||order.customer||{};\n if(String(oc.Id||oc.id||order.CustomerId||'')!==cid||String(order.OrderNumber||order.orderNumber||order.Number||order.number||'')!=='585742')throw Error('ORDER_OWNERSHIP_UNPROVEN');\n stage='customer';var customer=tmv3_fetchJson_(TMV3.API_BASE+'/v1/customers/'+cid,{method:'get'});\n stage='contacts';var contacts=tmv3_getCustomerContacts_(cid,{forceFresh:true,requireComplete:true});\n function phones(obj){var ps=obj.Phones||obj.phones||[];if(!Array.isArray(ps))throw Error('PHONE_SCHEMA_UNKNOWN');return ps.filter(function(p){return p.Active!==false&&p.active!==false;}).map(function(p){return tmv3_phone10_(p.Number||p.number||'');}).filter(function(p){return p.length===10;});}\n var cp=phones(customer);\n var same=contacts.filter(function(c){return /\\bJim\\b/i.test(c.Name)&&/Farquhar/i.test(c.Name);});\n\n stage='identity_confirmation';tmv3_taskFirstFreshOrderOwnershipById_(oid,cid,task.Name,'Install');\n if(same.length!==1||!(same[0].Phones||[]).some(function(p){return tmv3_phone10_(p)===phone;}))throw Error('CONTACT_IDENTITY_UNPROVEN');\n function stable(o){if(Array.isArray(o))return JSON.stringify(o.map(function(v){return JSON.parse(stable(v));}));if(o&&typeof o==='object'){var x={};Object.keys(o).sort().forEach(function(k){x[k]=JSON.parse(stable(o[k]));});return JSON.stringify(x);}return JSON.stringify(o===undefined?null:o);}\n function clean_(v){return String(v===undefined||v===null?'':v).trim();}function num_(v){return Number(v)||0;}function prop_(o,ks){for(var i=0;i<ks.length;i++)if(Object.prototype.hasOwnProperty.call(o||{},ks[i]))return o[ks[i]];}function arr_(v){return Array.isArray(v)?v:[];}function objectId_(o){return clean_(prop_(o,['Id','id','ID']));}\nfunction pair_(o){if(!o||typeof o!=='object')return null;var id=prop_(o,['Id','id','ID']),name=prop_(o,['Name','name']);if(id===undefined&&name===undefined)return null;return{Id:num_(id),Name:clean_(name)};}\nfunction pairs_(a){return arr_(a).map(pair_).filter(function(x){return x&&x.Id;});}\nfunction cf_(a){return arr_(a).map(function(x){var id=prop_(x,['Id','id','ID']);if(id===undefined||id===null||id==='')return null;var out={Id:num_(id)};var v=prop_(x,['Value','value']);var t=prop_(x,['ValueText','valueText']);if(v!==undefined)out.Value=v;if(t!==undefined)out.ValueText=t;return out;}).filter(Boolean);}\nfunction currency_(o){if(!o||typeof o!=='object')return null;var code=prop_(o,['CurrencyISOCode','currencyISOCode']),rate=prop_(o,['ExchangeRate','exchangeRate']);if(code===undefined&&rate===undefined)return null;return{CurrencyISOCode:clean_(code),ExchangeRate:Number(rate||0)};}\nfunction customerDto_(cur,mergedPhones,mergedAddr){var out={Id:num_(objectId_(cur)),Name:clean_(prop_(cur,['Name','name']))};function cp(n,alts){var v=prop_(cur,alts||[n,n.charAt(0).toLowerCase()+n.slice(1)]);if(v!==undefined&&v!==null)out[n]=v;}cp('Number',['Number','number']);cp('IsVendor',['IsVendor','isVendor']);cp('IsConsumerAccount',['IsConsumerAccount','isConsumerAccount']);var pc=pair_(prop_(cur,['PrimaryContact','primaryContact']));if(pc)out.PrimaryContact=pc;var st=pair_(prop_(cur,['Status','status']));if(st)out.Status=st;var cats=pairs_(prop_(cur,['Categories','categories']));if(cats.length)out.Categories=cats;var rs=pair_(prop_(cur,['ReferralSource','referralSource']));if(rs)out.ReferralSource=rs;var ind=pair_(prop_(cur,['Industry','industry']));if(ind)out.Industry=ind;cp('CustomerSince',['CustomerSince','customerSince']);cp('CreditLimit',['CreditLimit','creditLimit']);cp('WebSite',['WebSite','webSite']);cp('IsTaxExempt',['IsTaxExempt','isTaxExempt']);cp('IsFinanceChargeExempt',['IsFinanceChargeExempt','isFinanceChargeExempt']);var pt=pair_(prop_(cur,['PaymentTerm','paymentTerm']));if(pt)out.PaymentTerm=pt;var bl=pair_(prop_(cur,['BillToLocation','billToLocation']));if(bl)out.BillToLocation=bl;var sl=pair_(prop_(cur,['ShipToLocation','shipToLocation']));if(sl)out.ShipToLocation=sl;out.Phones=mergedPhones;out.PrimaryAddress=mergedAddr;var pl=pair_(prop_(cur,['PriceList','priceList']));if(pl)out.PriceList=pl;var cfs=cf_(prop_(cur,['CustomFields','customFields']));if(cfs.length)out.CustomFields=cfs;var curcy=currency_(prop_(cur,['Currency','currency']));if(curcy)out.Currency=curcy;return out;}\n var props=PropertiesService.getScriptProperties(),profileChanged=false,taskChanged=false;\n var currentPhones=customer.Phones||customer.phones||[];\n if(!Array.isArray(currentPhones))throw Error('PHONE_SCHEMA_UNKNOWN');\n if(cp.indexOf(phone)<0){\n  if(currentPhones.some(function(p){return tmv3_phone10_(p.Number||p.number||'')===phone;}))throw Error('INACTIVE_PHONE_REQUIRES_REVIEW');\n  var rawContacts=tmv3_arrayFromApiResponse_(tmv3_fetchJson_(TMV3.API_BASE+'/v1/customers/'+cid+'/contacts',{method:'get'}));\n  var rc=rawContacts.filter(function(c){return String(c.Id||c.id||'')===String(same[0]['Contact ID']);});\n  if(rc.length!==1)throw Error('RAW_CONTACT_NOT_UNIQUE');\n  var phoneSource=rc[0];\n  if(!Array.isArray(phoneSource.Phones||phoneSource.phones)){\n   stage='contact_phone_detail';phoneSource=tmv3_fetchJson_(TMV3.API_BASE+'/v1/contacts/'+same[0]['Contact ID'],{method:'get'});\n   var named=[phoneSource.FirstName||phoneSource.firstName||'',phoneSource.LastName||phoneSource.lastName||''].join(' ');\n   if(!/Jim/i.test(named)||!/Farquhar/i.test(named))throw Error('GLOBAL_CONTACT_IDENTITY_MISMATCH');\n  }\n  var matching=(phoneSource.Phones||phoneSource.phones||[]).filter(function(p){return p.Active!==false && tmv3_phone10_(p.Number||p.number||'')===phone;});\n  if(matching.length!==1)return {status:'CONTACT_PHONE_SCHEMA_REVIEW',contactKeys:Object.keys(phoneSource),phoneCollectionKeys:(phoneSource.Phones||phoneSource.phones||[]).map(function(p){return Object.keys(p);}),matchingPhoneCount:matching.length,strivenWrites:0};\n  var src=matching[0],pt=pair_(src.PhoneType||src.phoneType);\n  if(!pt||!pt.Id)throw Error('PHONE_TYPE_UNRESOLVED');\n  var newPhone={Id:0,PhoneType:pt,CountryDialCode:Number(src.CountryDialCode||src.countryDialCode||1),Number:src.Number||src.number,Extension:src.Extension||src.extension||'',IsPreferred:!currentPhones.some(function(p){return p.Active!==false&&p.IsPreferred===true;}),Active:true};\n  var payload=customerDto_(customer,currentPhones.concat([newPhone]),customer.PrimaryAddress||customer.primaryAddress||{});\n  if(stable(tmv3_fetchJson_(TMV3.API_BASE+'/v1/customers/'+cid,{method:'get'}))!==stable(customer))throw Error('CUSTOMER_CHANGED_BEFORE_WRITE');\n  var key='TMV3_JIM_CUSTOMER_PHONE_PATCH_20261026';\n  if(props.getProperty(key))throw Error('PRIOR_CUSTOMER_WRITE_REQUIRES_RECONCILIATION');\n  stage='customer_post';props.setProperty(key,'INTENT');\n  tmv3_fetchJson_(TMV3.API_BASE+'/v1/customers',{method:'post',contentType:'application/json',payload:JSON.stringify(payload)});\n  stage='customer_readback';var afterCustomer=tmv3_fetchJson_(TMV3.API_BASE+'/v1/customers/'+cid,{method:'get'});\n  if(phones(afterCustomer).indexOf(phone)<0)throw Error('CUSTOMER_PHONE_READBACK_FAILED');\n  var beforeDto=customerDto_(customer,[],customer.PrimaryAddress||customer.primaryAddress||{}),afterDto=customerDto_(afterCustomer,[],afterCustomer.PrimaryAddress||afterCustomer.primaryAddress||{});\n  if(stable(beforeDto)!==stable(afterDto))throw Error('CUSTOMER_OTHER_FIELDS_CHANGED_REVIEW');\n  props.setProperty(key,'VERIFIED');profileChanged=true;\n }\n if(!tmv3_allPhones_(task.Name||'').some(function(p){return tmv3_phone10_(p)===phone;})){\n  stage='task_patch';var again=tmv3_getTaskById_(18978);\n  if(stable(again)!==stable(task))throw Error('TASK_CHANGED_BEFORE_WRITE');\n  var newName=String(task.Name).replace(/\\s*-\\s*$/,'')+' - ('+phone.slice(0,3)+') '+phone.slice(3,6)+'-'+phone.slice(6);\n  var taskKey='TMV3_JIM_TASK_NAME_PATCH_20261026';if(props.getProperty(taskKey))throw Error('PRIOR_TASK_WRITE_REQUIRES_RECONCILIATION');\n  props.setProperty(taskKey,'INTENT');\n  tmv3_fetchJson_(TMV3.API_BASE+'/v2/tasks/18978',{method:'patch',contentType:'application/json',payload:JSON.stringify({Id:18978,Name:newName})});\n  stage='task_readback';var afterTask=tmv3_getTaskById_(18978);if(afterTask.Name!==newName)throw Error('TASK_NAME_READBACK_FAILED');\n  var beforeOther=Object.assign({},task),afterOther=Object.assign({},afterTask);delete beforeOther.Name;delete afterOther.Name;delete beforeOther.Fingerprint;delete afterOther.Fingerprint;\n  if(stable(beforeOther)!==stable(afterOther))throw Error('TASK_OTHER_FIELDS_CHANGED_REVIEW');\n  props.setProperty(taskKey,'VERIFIED');taskChanged=true;\n }\n return {status:'SINGLE_EVENT_SYNC_VERIFIED',customerPhoneAdded:profileChanged,taskNameUpdated:taskChanged,contactPhoneAlreadyPresent:true,calendarWrites:0,customerPhoneReadback:true,taskNameReadback:true};\n}catch(e){return {status:'READ_FAILED',stage:stage,knownReason:/^[A-Z_]+$/.test(e.message)?e.message:'API_OR_RUNTIME_ERROR',writesMayHaveOccurred:/customer_post|customer_readback|task_patch|task_readback/.test(stage)};}}";
          const candidate={files:before.files.concat([{name:'99_JimReadOnly20261026',type:'SERVER_JS',source:helper}])};
          if(before.files.some(f=>f.name==='99_JimReadOnly20261026'))throw Error('HELPER_ALREADY_EXISTS');
          const inv=await api('projects/'+sid+'/deployments');const ds=inv.deployments.filter(d=>(d.entryPoints||[]).some(e=>e.entryPointType==='EXECUTION_API'||e.executionApi));if(ds.length!==1)throw Error('EXECUTABLE_AMBIGUOUS');
